<p class="lead">Imagine uma loja que passou oito meses montando um aplicativo próprio. Ninguém baixa. O dono sabe disso, a equipe sabe disso, e mesmo assim toda segunda-feira tem reunião do aplicativo. O motivo oficial é "falta pouco". O motivo real é que ninguém quer ser a pessoa que diz que oito meses foram pro lixo.</p>

<h2>Todo sim é um não pra outra coisa</h2>
<p>Você tem uma quantidade fixa de horas, de dinheiro e de atenção. Quando coloca um desses recursos num lugar, ele deixa de existir pra todos os outros. Isso é <strong>custo de oportunidade</strong>: o valor da melhor alternativa que você deixou de fazer.</p>
<p>O problema é que esse custo não aparece em lugar nenhum. Não tem boleto, não tem linha no extrato, ninguém te cobra. O que você gastou no projeto A está na planilha. O que você deixou de ganhar no projeto B, que nunca começou, não está.</p>
<p>Por isso a gente avalia as coisas do jeito errado. A pergunta que vem natural é "isso vale a pena?". Quase tudo vale a pena quando comparado com nada. A pergunta útil é outra: "isso vale mais do que a melhor outra coisa que eu faria com o mesmo recurso?".</p>

<div class="box key"><span class="box-t">Ideia central</span><p>Nenhuma opção é boa ou ruim sozinha. Ela é melhor ou pior do que a alternativa. Se você não sabe qual é a alternativa, ainda não está decidindo, só está reagindo ao que apareceu na sua frente.</p></div>

<p>Isso muda a conversa. Aceitar um cliente grande que dá pouco lucro e consome o time inteiro pode ser "bom negócio" no papel e péssimo na prática, porque ocupa a capacidade que atenderia três clientes médios. Cuidar você mesmo das redes sociais "pra economizar" tem um preço: as horas que o dono gasta editando vídeo são as horas mais caras da empresa.</p>

<div class="box trigger" data-tid="09-1"><span class="box-t">Gatilho</span><p><b>Se</b> estou prestes a dizer sim pra um projeto, pedido ou compromisso que leva mais de um dia, <b>então</b> escrevo antes, numa linha, o que vai deixar de ser feito pra isso caber. Se eu não consigo nomear o que sai, a resposta é "ainda não".</p></div>

<h2>O dinheiro que já foi não volta</h2>
<p><strong>Custo afundado</strong> é tudo o que você já gastou e não recupera, decida o que decidir daqui pra frente. Tempo, dinheiro, esforço, reputação. A lógica é simples: se não volta em nenhum cenário, não deveria pesar na escolha entre os cenários. Só importa o que vem pela frente: quanto ainda custa, e quanto ainda rende.</p>
<p>Na prática, a gente faz o contrário. Quanto mais já colocou, mais difícil largar. Kahneman e Tversky ajudam a explicar o porquê: perder dói mais do que ganhar agrada. Abandonar um projeto transforma um gasto "em andamento" numa perda confirmada, com data e responsável. Continuar mantém viva a esperança de que o gasto ainda vire investimento. Então a gente continua, e a perda cresce.</p>
<p>Tem também o lado social. Desistir em público parece confissão de erro. Muito projeto morto continua respirando por aparelhos só pra poupar o orgulho de quem o criou.</p>

<div class="box ex"><span class="box-t">Na prática</span><p>Exemplo hipotético: você comprou um lote grande de um produto que não gira. O preço que pagou é custo afundado. A decisão de hoje não é "como recupero o que paguei", é "qual o melhor uso desse estoque e desse espaço a partir de agora". Se liquidar abaixo do custo libera caixa e prateleira pra um produto que vende, liquidar é a decisão certa, mesmo que doa olhar pra nota fiscal de compra.</p></div>

<h3>O teste do começo do zero</h3>
<p>Existe uma pergunta que limpa o custo afundado da cabeça em dez segundos: <strong>se eu começasse hoje, sabendo tudo o que sei agora, eu entraria nisso?</strong></p>
<p>Se a resposta é sim, continue, e continue sem culpa. Se a resposta é não, a única pergunta que resta é qual o jeito mais barato e mais rápido de sair. Vale pra projeto, pra fornecedor, pra ferramenta contratada, pra sociedade, pra curso pela metade.</p>

<div class="box trigger" data-tid="09-2"><span class="box-t">Gatilho</span><p><b>Se</b> me pego defendendo um projeto com a frase "mas a gente já investiu tanto nisso", <b>então</b> paro e respondo por escrito: "se fosse começar hoje, do zero, com o que sei agora, eu entraria?". Se a resposta for não, marco pra mesma semana a conversa de encerramento.</p></div>

<h2>Defina a morte antes de nascer</h2>
<p>O pior momento pra decidir se um projeto deve morrer é no meio dele. Você está cansado, envolvido, com orgulho em jogo, e sempre parece que falta pouco. O melhor momento é antes de começar, quando você ainda está frio.</p>
<p>A ferramenta pra isso são os <strong>critérios de morte</strong> (em inglês, <em>kill criteria</em>; Annie Duke escreveu bastante sobre o assunto). Funciona assim: antes de iniciar, você escreve uma combinação de <strong>estado</strong> e <strong>data</strong>. "Se até tal dia eu não tiver tal resultado, eu paro." Alpinistas sérios fazem isso com horário de retorno: se não chegou ao cume até determinada hora, volta, não importa o quão perto esteja. A regra existe justamente porque lá em cima, perto do cume, ninguém pensa direito.</p>
<p>Bons critérios de morte têm três características:</p>
<ul>
<li><strong>São mensuráveis.</strong> "Se não estiver indo bem" não serve. "Se em 60 dias não tiver pelo menos 30 pedidos vindos desse canal" serve.</li>
<li><strong>Têm data.</strong> Sem prazo, todo projeto está sempre "quase lá".</li>
<li><strong>Estão escritos e alguém mais sabe.</strong> Contar pra um sócio, cônjuge ou funcionário de confiança torna mais difícil você renegociar consigo mesmo depois.</li>
</ul>

<div class="box trigger" data-tid="09-3"><span class="box-t">Gatilho</span><p><b>Se</b> vou começar um projeto novo que dura mais de duas semanas, <b>então</b> antes do primeiro dia de trabalho escrevo a frase "eu paro se até [data] não tiver [resultado medível]" e mando pra uma pessoa que vai me cobrar.</p></div>

<h2>É hora de matar ou é só o vale do meio?</h2>
<p>Nem toda dificuldade é sinal pra desistir. Quase todo projeto que vale a pena tem um <strong>vale do meio</strong>: a empolgação do início acabou, o resultado ainda não veio, e o trabalho ficou chato. Largar tudo no vale é tão ruim quanto insistir num cadáver. A diferença entre os dois casos costuma estar nos sinais abaixo. (Regra de bolso minha, não ciência.)</p>

<div class="table-wrap"><table>
<thead><tr><th>Sinais de que é hora de matar</th><th>Sinais de que é só o vale do meio</th></tr></thead>
<tbody>
<tr><td>O critério de morte que você mesmo escreveu foi atingido</td><td>Os indicadores sobem devagar, mas sobem</td></tr>
<tr><td>A hipótese central foi testada e deu errado</td><td>A hipótese central ainda não foi testada de verdade</td></tr>
<tr><td>Você não entraria nisso hoje, começando do zero</td><td>Você entraria de novo, só que com um plano melhor</td></tr>
<tr><td>O argumento pra continuar é o que já foi gasto</td><td>O argumento pra continuar é o que ainda vem</td></tr>
<tr><td>Cada prazo vencido vira um prazo novo, sem mudança de plano</td><td>Os atrasos têm causa conhecida e correção em andamento</td></tr>
<tr><td>Surgiu alternativa claramente melhor pro mesmo recurso</td><td>A vontade de largar é tédio, não informação nova</td></tr>
</tbody>
</table></div>

<div class="box warn"><span class="box-t">Armadilha</span><p>Usar "custo afundado" como desculpa pra largar tudo que fica difícil. Quem troca de projeto a cada vale do meio nunca colhe nada, só coleciona começos. O conceito serve pra ignorar o passado na conta, não pra ignorar o futuro. Se o que vem pela frente ainda compensa, o desconforto de agora é só o preço.</p></div>

<h2>Matar sem drama</h2>
<p>Decidiu encerrar? Faça direito e faça rápido. Projeto zumbi, aquele que ninguém declara morto mas ninguém toca, é o pior dos mundos: continua ocupando espaço mental, aparecendo em lista, gerando culpa.</p>
<ol>
<li><strong>Declare.</strong> Diga com todas as letras, pra quem estava envolvido: "esse projeto acabou". Sem "vamos dar uma pausa" se não for pausa.</li>
<li><strong>Salve o que presta.</strong> Código, contatos, aprendizados, equipamento. Dez linhas escritas sobre o que você aprendeu valem mais do que parece.</li>
<li><strong>Corte os custos recorrentes no mesmo dia.</strong> Assinatura, domínio, ferramenta, mensalidade. Projeto morto que continua cobrando no cartão é comum demais.</li>
<li><strong>Realoque o recurso em voz alta.</strong> Diga pra onde vão as horas e o dinheiro liberados. Se você não decidir, o vácuo é preenchido por bobagem.</li>
</ol>
<p>E uma observação sobre orgulho: encerrar um projeto ruim cedo é sinal de bom julgamento. Quem nunca mata nada ou arrisca pouco demais, ou está carregando defunto.</p>

<div class="box ask"><span class="box-t">Pergunte-se</span><ul><li>Qual projeto meu só continua vivo porque eu tenho vergonha de encerrar?</li><li>O que eu faria com essas horas se ele sumisse amanhã?</li><li>Qual foi a última coisa pra qual eu disse não? Faz quanto tempo?</li></ul></div>

<p class="lead">Duas pessoas têm a mesma ideia: vender kits prontos em vez de produtos avulsos. A primeira passa três meses desenhando embalagem, negociando com gráfica e montando estoque de doze kits. A segunda junta três produtos que já tem na prateleira, tira uma foto, sobe um anúncio na sexta e olha os pedidos na segunda. Uma delas vai saber a resposta noventa dias antes da outra, gastando quase nada.</p>

<h2>Opinião é barata, dado é caro, teste é o meio-termo</h2>
<p>Quando surge uma ideia, o caminho comum é discutir. Reunião, planilha de projeção, pesquisa na internet, pedir opinião pro cunhado. Tudo isso produz mais opinião, e opinião sobre o futuro vale pouco, inclusive a sua.</p>
<p>O caminho pragmático é perguntar pra realidade. Um teste pequeno, mesmo tosco, tem uma vantagem que nenhuma discussão tem: o resultado não depende de quem argumenta melhor. O cliente comprou ou não comprou. O fornecedor entregou no prazo ou não entregou.</p>
<p>A pergunta que organiza este capítulo é: <strong>qual é a coisa mais barata e rápida que eu posso fazer pra descobrir se estou errado?</strong> Repare no "errado". Teste bom é o que consegue te contrariar. Se qualquer resultado confirmaria sua ideia, aquilo não é teste, é teatro.</p>

<div class="box key"><span class="box-t">Ideia central</span><p>Antes de construir a coisa inteira, construa o menor pedaço capaz de derrubar a sua hipótese. O objetivo do primeiro teste não é dar lucro nem ficar bonito. É comprar informação pelo menor preço possível.</p></div>

<h2>Escreva a hipótese antes de olhar o resultado</h2>
<p>Esse passo parece burocracia e é o mais importante do capítulo. Antes de rodar o teste, escreva três coisas:</p>
<ol>
<li><strong>O que eu acredito.</strong> "Clientes preferem comprar kit pronto a montar o próprio carrinho."</li>
<li><strong>O que eu espero ver se estiver certo.</strong> "Em 7 dias, o kit vende pelo menos 10 unidades com o mesmo orçamento de anúncio dos avulsos."</li>
<li><strong>O que eu faço em cada caso.</strong> "Se bater 10, crio mais dois kits. Se ficar abaixo de 4, arquivo a ideia. No meio, repito mais uma semana com outra foto."</li>
</ol>
<p>Por que escrever antes? Porque depois que o resultado chega, a sua cabeça dá um jeito de achar que ele era o esperado. Vendeu 5? "Ótimo começo!" ou "era teste, não conta", dependendo do quanto você gosta da ideia. Com o número escrito antes, não tem como trapacear consigo mesmo. É o mesmo princípio dos critérios de morte do capítulo 9, em escala de dias em vez de meses.</p>

<div class="box trigger" data-tid="10-1"><span class="box-t">Gatilho</span><p><b>Se</b> vou testar qualquer coisa (anúncio, preço, produto, processo), <b>então</b> antes de começar escrevo numa nota: o que eu acredito, que número espero ver até que data, e o que faço se der acima, abaixo ou no meio.</p></div>

<h2>Como encolher uma ideia grande</h2>
<p>Quase toda ideia grande esconde uma ou duas apostas centrais. O resto é execução. O truque é isolar a aposta mais arriscada e testar só ela, fingindo ou improvisando todo o resto. Não precisa de sistema se dá pra fazer na mão com cinco clientes. Não precisa de estoque se dá pra vender primeiro e comprar depois, avisando o prazo. Não precisa de site novo se uma página simples responde à dúvida.</p>

<div class="table-wrap"><table>
<thead><tr><th>Ideia grande</th><th>Menor teste</th><th>O que aprende e quanto custa</th></tr></thead>
<tbody>
<tr><td>Lançar linha de kits</td><td>Um kit com produtos que já tem, uma foto, um anúncio por 7 dias</td><td>Se existe demanda por kit. Custo: uma tarde e a verba do anúncio</td></tr>
<tr><td>Abrir clube de assinatura</td><td>Oferecer por mensagem a 30 clientes recorrentes, cobrando de verdade</td><td>Se alguém paga todo mês. Custo: uma hora de mensagens</td></tr>
<tr><td>Contratar um vendedor</td><td>Um freelancer por 2 semanas com meta clara, ou você mesmo 1 hora por dia</td><td>Se venda ativa traz pedido. Custo: duas semanas de diária</td></tr>
<tr><td>Trocar de plataforma</td><td>Subir 20 produtos na nova e fazer 5 pedidos de teste do início ao fim</td><td>Onde trava na prática. Custo: alguns dias, zero risco pra loja atual</td></tr>
<tr><td>Trazer marca nova</td><td>Pedido mínimo de 3 itens mais procurados, antes do contrato de exclusividade</td><td>Se gira e qual a margem real. Custo: um pedido pequeno</td></tr>
<tr><td>Mudar rotina da família</td><td>Testar por uma semana, combinando que sexta todo mundo avalia</td><td>Se funciona na vida real. Custo: uma semana, reversível</td></tr>
</tbody>
</table></div>

<p>Note um padrão: os melhores testes pedem <strong>compromisso real</strong> do outro lado. Perguntar "você compraria?" não vale nada, porque dizer sim é de graça. Pedir o pagamento, o cadastro, o pedido fechado, isso vale. As pessoas são gentis nas pesquisas e sinceras no cartão de crédito.</p>

<div class="box ex"><span class="box-t">Na prática</span><p>Exemplo hipotético: uma loja quer saber se frete grátis acima de certo valor aumenta o ticket médio. Em vez de debater por um mês, liga a regra por duas semanas e compara com as duas semanas anteriores: ticket médio, número de pedidos e margem depois do frete. Hipótese escrita antes: "o ticket sobe o bastante pra cobrir o frete que eu passo a pagar". Se a margem total cair, desliga. É uma porta de duas vias, o risco é pequeno e a resposta vem em quinze dias.</p></div>

<h2>O ciclo: observar, orientar, decidir, agir</h2>
<p>John Boyd, piloto de caça e estrategista militar americano, descreveu o combate como um ciclo que ficou conhecido como <strong>OODA</strong>: observar, orientar, decidir, agir. Você olha o que está acontecendo, interpreta à luz do que sabe, escolhe, age, e o resultado da ação vira a próxima observação.</p>
<p>A sacada de Boyd que interessa aqui: vence quem completa o ciclo <strong>mais rápido</strong>, não quem faz cada volta com perfeição. Quem gira rápido erra pequeno, corrige cedo e está sempre reagindo à situação atual. Quem gira devagar toma decisões caprichadas sobre uma realidade que já mudou.</p>
<p>Traduzindo pra negócio e pra vida: <strong>encurte o tempo entre fazer e saber</strong>. Um teste que dá resposta em três dias e pode ser repetido dez vezes ensina mais do que um projeto de três meses que dá uma resposta só. E na hora de medir, escolha uma métrica principal, definida antes, ligada diretamente à hipótese. Medir vinte coisas garante que alguma vai subir, e você vai se agarrar nela.</p>

<div class="box trigger" data-tid="10-2"><span class="box-t">Gatilho</span><p><b>Se</b> uma discussão sobre "será que funciona?" passa de 15 minutos sem dado novo, <b>então</b> interrompo e pergunto: "qual o menor teste que responde isso até sexta-feira?". A gente sai da conversa com o teste marcado, não com mais uma opinião.</p></div>

<div class="box warn"><span class="box-t">Armadilha</span><p>Teste pequeno demais ou malfeito, que derruba ideia boa. Um anúncio ruim rodando dois dias não prova que o produto não vende. Antes de arquivar, pergunte se o teste falhou ou se a execução do teste falhou. E cuidado com o erro oposto: viver de teste. Testar pra sempre é um jeito elegante de nunca se comprometer.</p></div>

<h2>Quando parar de testar e escalar</h2>
<p>Teste serve pra reduzir incerteza até o ponto em que decidir fica razoável, e esse ponto chega antes da certeza. Três sinais de que é hora de parar de experimentar e colocar recurso de verdade:</p>
<ul>
<li><strong>O resultado se repetiu.</strong> Uma vez pode ser sorte. Duas ou três vezes, em condições um pouco diferentes, já é padrão.</li>
<li><strong>O próximo teste não mudaria sua decisão.</strong> Se qualquer resultado plausível te leva a fazer a mesma coisa, o teste é enrolação.</li>
<li><strong>O custo de esperar ficou maior que o custo de errar.</strong> Concorrente entrando, temporada chegando, cliente pedindo.</li>
</ul>
<p>E escale em degraus. De 1 kit pra 3, de 3 pra 10. Cada degrau é um teste novo, porque o que funciona pequeno nem sempre funciona grande: o fornecedor que atende 20 unidades pode falhar com 500, o processo manual que aguenta 5 pedidos por dia quebra com 50. Quem sobe em degraus descobre o ponto de quebra enquanto ele ainda é barato.</p>
<p>Quando o teste dá errado, não trate como fracasso. Você pagou pouco por uma informação que, do outro jeito, custaria meses. Anote o que aprendeu em duas linhas e vá pra próxima hipótese.</p>

<section class="recap">
<h2>Fechamento</h2>
<h3>Em 3 linhas</h3>
<ol><li>Antes de construir tudo, rode o menor teste capaz de provar que você está errado, de preferência pedindo compromisso real (pagamento, pedido, cadastro).</li><li>Escreva antes: hipótese, número esperado, data, e o que faz em cada resultado.</li><li>Ganha quem gira o ciclo mais rápido. Encurte o tempo entre fazer e saber, e escale em degraus.</li></ol>
<h3>Exercício de 5 minutos</h3>
<p>Pegue a ideia que está há mais tempo na sua cabeça sem sair do lugar. Escreva: qual é a aposta mais arriscada dentro dela? Qual teste, de no máximo uma semana e custo baixo, poderia derrubar essa aposta? Que número você espera ver? Marque na agenda o dia em que o teste começa.</p>
</section>

<template id="ch-11">
<p class="lead">Você já decidiu umas quinze vezes que ia revisar o financeiro toda semana. Decidiu de verdade, com convicção. E toda semana chega sexta à noite, a revisão não aconteceu e você nem lembra em que momento escolheu não fazer. A resposta é que não escolheu. O momento passou sem avisar.</p>

<h2>Por que força de vontade é um plano ruim</h2>
<p>A maioria das boas intenções morre do mesmo jeito. Não é preguiça nem falta de caráter. É que a intenção é vaga ("vou cuidar melhor do financeiro") e a vida é concreta (são 16h40, tem três mensagens de cliente, o fornecedor ligou). No choque entre o vago e o concreto, o concreto ganha sempre.</p>
<p>Contar com força de vontade significa apostar que, na hora certa, você vai: lembrar da intenção, perceber que aquela é a hora, decidir agir, e vencer a vontade de fazer outra coisa. São quatro chances de falhar, todas num momento em que sua cabeça está ocupada com outro assunto.</p>
<p>(Uma nota de honestidade: a teoria famosa de que a força de vontade é um "tanque" que esvazia ao longo do dia é contestada, vários estudos não conseguiram repetir o resultado. Não preciso dela aqui. O argumento é mais simples: plano que depende de lembrar e decidir na hora falha muito, com tanque cheio ou vazio.)</p>
<p>A saída é tirar a decisão do momento. Decidir antes, a frio, e deixar pro momento só a execução.</p>

<h2>A descoberta de Gollwitzer</h2>
<p>O psicólogo alemão Peter Gollwitzer estuda há décadas a distância entre querer e fazer. A ferramenta que ele propôs chama <strong>intenção de implementação</strong>, e tem um formato fixo: <strong>se</strong> acontecer a situação X, <strong>então</strong> eu faço Y.</p>
<p>A diferença parece pequena demais pra importar. "Quero me exercitar mais" é uma intenção de meta. "Se for segunda, quarta ou sexta e eu acabar de deixar meu filho na escola, então vou direto pra academia sem passar em casa" é uma intenção de implementação. Em um grande número de estudos, sobre os assuntos mais variados (exercício, alimentação, prazos, exames médicos), quem formulou o plano no formato se-então cumpriu mais do que quem só tinha a meta, mesmo com a mesma motivação.</p>
<p>O mecanismo proposto é o seguinte: ao ligar uma ação a uma situação específica, você entrega o controle pro ambiente. A situação aparece e puxa a ação, quase como um reflexo. Você não precisa lembrar, porque a deixa lembra por você. Não precisa deliberar, porque já deliberou.</p>

<div class="box key"><span class="box-t">Ideia central</span><p>Um gatilho se-então é uma decisão tomada com antecedência e amarrada a uma deixa do mundo real. Quando a deixa aparece, você não pensa, só executa. É por isso que este livro inteiro é cheio deles.</p></div>

<h2>Anatomia de um bom gatilho</h2>
<p>Todo gatilho tem duas metades, e cada uma tem um jeito certo de ser escrita.</p>
<p><strong>A deixa (o "se")</strong> precisa ser algo que você percebe sem esforço: um horário, um lugar, o fim de outra atividade, uma frase que alguém diz, uma emoção forte e reconhecível. "Se eu tiver tempo" não é deixa, porque ninguém nunca percebe que "tem tempo". "Se eu fechar o caixa de sexta" é.</p>
<p><strong>A ação (o "então")</strong> precisa ser física, específica e pequena o bastante pra começar em menos de um minuto. "Então penso melhor" não é ação. "Então abro a planilha e preencho a linha da semana" é. Se a ação for grande, o gatilho aponta só pro primeiro passo. O resto costuma vir no embalo.</p>

<div class="table-wrap"><table>
<thead><tr><th>Gatilho ruim</th><th>Por que falha</th><th>Gatilho bom</th></tr></thead>
<tbody>
<tr><td>Vou responder os clientes mais rápido</td><td>Não tem deixa nem ação</td><td>Se terminei o almoço, então abro a caixa de mensagens e respondo até zerar ou até dar 30 min</td></tr>
<tr><td>Se sobrar tempo, reviso o estoque</td><td>A deixa nunca acontece</td><td>Se é segunda e liguei o computador, então a primeira tela que abro é o relatório de estoque baixo</td></tr>
<tr><td>Se eu ficar estressado, então me acalmo</td><td>Ação vaga, impossível de executar</td><td>Se percebo que levantei a voz, então peço 5 minutos e saio da sala</td></tr>
<tr><td>Vou gastar menos</td><td>Meta, não gatilho</td><td>Se quero comprar algo acima de certo valor que não estava planejado, então coloco na lista e espero 48h</td></tr>
</tbody>
</table></div>

<div class="box trigger" data-tid="11-1"><span class="box-t">Gatilho</span><p><b>Se</b> me pego dizendo "preciso começar a fazer X" pela segunda vez, <b>então</b> paro e reescrevo na hora como "se [deixa que eu percebo sem esforço], então [primeiro passo físico de menos de um minuto]", e anoto onde vou ver.</p></div>

<h2>Empilhe em cima do que já existe</h2>
<p>As melhores deixas são rotinas que já acontecem sozinhas. Você já toma café, já deixa o filho na escola, já fecha o caixa, já escova os dentes. Cada uma dessas é um gancho pronto. O pesquisador BJ Fogg, de Stanford, chama isso de âncora: o hábito novo vem logo depois de um hábito velho, e o velho serve de lembrete.</p>
<p>O formato fica: "depois que eu [rotina que já existe], eu [ação nova e pequena]". Depois que servir o café, abro o extrato do banco. Depois que fechar o notebook, escrevo as três prioridades de amanhã. A rotina antiga carrega a nova nas costas até ela andar sozinha.</p>
<p>Quanto tempo leva pra virar automático? Desconfie de qualquer número redondo. Os "21 dias" que circulam por aí não têm base sólida, e o que a pesquisa sugere é que varia muito de pessoa pra pessoa e de hábito pra hábito. Regra de bolso: enquanto você ainda precisa lembrar, mantenha o gatilho escrito em algum lugar visível.</p>

<div class="box trigger" data-tid="11-2"><span class="box-t">Gatilho</span><p><b>Se</b> quero instalar um hábito novo, <b>então</b> escolho uma rotina que já faço todo dia sem falhar e escrevo: "depois que eu [rotina], eu [ação de no máximo 2 minutos]". Só aumento a ação depois de duas semanas sem furo.</p></div>

<h2>Desenhe o ambiente: atrito a seu favor</h2>
<p>Gatilho funciona melhor quando o ambiente colabora. O princípio é simples: <strong>tire atrito do que você quer fazer e ponha atrito no que você quer evitar</strong>. Cada passo a mais entre você e uma ação diminui a chance de ela acontecer, pro bem e pro mal.</p>
<ul>
<li>Quer revisar os números toda manhã? Deixe a planilha como página inicial do navegador.</li>
<li>Quer parar de olhar o celular no jantar? O carregador fica em outro cômodo.</li>
<li>Quer comprar menos por impulso? Apague o cartão salvo nas lojas. Digitar dezesseis números dá tempo de pensar.</li>
</ul>

<div class="box ex"><span class="box-t">Na prática</span><p>Exemplo hipotético: um dono de loja quer ler relatórios antes de abrir mensagens, mas toda manhã cai no aplicativo de mensagens primeiro. Em vez de prometer disciplina, ele tira o aplicativo da tela inicial do celular, desliga as notificações até as 9h e deixa o relatório abrindo sozinho quando liga o computador. O gatilho vira: "se liguei o computador, então leio o relatório que já está na tela antes de qualquer outra aba". A parte difícil foi resolvida na véspera, por configuração.</p></div>

<h2>Gatilhos de parada: quando a ação certa é não agir</h2>
<p>Boa parte dos erros caros não vem de deixar de fazer. Vem de fazer na hora errada: o e-mail respondido com raiva, a compra por impulso, o desconto dado no susto, a bronca em público. Pra esses casos, o "então" do gatilho é um freio.</p>
<p>A deixa costuma ser uma emoção forte (raiva, euforia, medo de perder a oportunidade) ou uma pressão de tempo criada por outra pessoa ("só vale até hoje"). Emoção forte é uma ótima deixa, porque é fácil de perceber. E quase nenhuma decisão piora por esperar uma noite.</p>

<div class="box trigger" data-tid="11-3"><span class="box-t">Gatilho</span><p><b>Se</b> estou escrevendo uma mensagem com raiva, <b>então</b> escrevo tudo no bloco de notas, não no aplicativo, e só decido se envio depois de dormir. A versão do dia seguinte costuma sair bem mais curta, quando sai.</p></div>

<div class="box trigger" data-tid="11-4"><span class="box-t">Gatilho</span><p><b>Se</b> alguém me pressiona a decidir na hora ("só vale hoje", "tem outro interessado"), <b>então</b> respondo "se precisa ser agora, a resposta é não; se puder ser amanhã, eu avalio". Oferta boa de verdade quase sempre sobrevive a 24 horas.</p></div>

<div class="box warn"><span class="box-t">Armadilha</span><p>Criar vinte gatilhos numa tarde de empolgação. Cada gatilho novo exige atenção até virar automático, e atenção é pouca. Instale um ou dois por vez, os que atacam o erro que mais te custa hoje. Outro erro comum: gatilho rígido aplicado em situação que mudou. Gatilho é ferramenta sua. Se parou de servir, reescreva sem culpa.</p></div>

<p class="lead">Faça a conta agora, de cabeça: quantos projetos você tem abertos? Conte os da empresa, os pessoais, os "quase prontos" e os que estão parados mas que você ainda considera seus. Se passou de cinco, a má notícia é que você não tem cinco projetos andando. Tem cinco projetos atrasando uns aos outros.</p>

<h2>A conta que ninguém faz</h2>
<p>Imagine três projetos de um mês cada. Se você faz um de cada vez, o primeiro fica pronto no fim do mês 1, o segundo no fim do mês 2, o terceiro no fim do mês 3. Se você toca os três em paralelo, dividindo o tempo igualmente, os três ficam prontos no fim do mês 3. Na melhor das hipóteses.</p>
<p>Olhe de novo. No paralelo, <strong>nada</strong> é entregue antes. O primeiro projeto, que poderia estar rendendo desde o mês 1, só começa a render no mês 3. Você trabalhou a mesma quantidade e recebeu o retorno dois meses depois. E isso supondo que alternar não custa nada, o que é falso.</p>
<p>Alternar custa. Toda vez que você troca de assunto, precisa recarregar o contexto: onde parei, o que faltava, qual era o problema. A pesquisadora Sophie Leroy deu nome a um pedaço desse custo: <strong>resíduo de atenção</strong>. Parte da sua cabeça continua na tarefa anterior, principalmente se ela ficou inacabada, e o desempenho na tarefa nova cai. O que a gente chama de multitarefa é, na prática, alternância rápida com pedágio em cada troca.</p>

<div class="box key"><span class="box-t">Ideia central</span><p>Projeto começado não vale nada. Só projeto terminado rende. Então a meta não é começar mais coisas nem estar ocupado com muitas. É diminuir o tempo entre começar e terminar cada uma, e isso se faz tendo menos coisas abertas ao mesmo tempo.</p></div>

<h2>Limite de trabalho em andamento</h2>
<p>O sistema de produção da Toyota, e depois o método Kanban usado em equipes de software, tem uma regra que parece boba e muda tudo: <strong>limite de trabalho em andamento</strong> (em inglês, WIP). Existe um número máximo de itens que podem estar "em andamento" ao mesmo tempo. Atingiu o limite? Pra começar algo novo, primeiro termine ou tire algo da coluna.</p>
<p>O efeito é que o gargalo aparece. Sem limite, quando uma tarefa trava (esperando fornecedor, esperando aprovação), você simplesmente começa outra, e outra, e em três meses tem quinze coisas travadas. Com limite, a tarefa travada ocupa uma vaga e incomoda, e você é obrigado a destravar ou a decidir conscientemente tirá-la da fila.</p>
<p>Pra uma pessoa, minha sugestão (regra de bolso, não ciência): <strong>no máximo três projetos ativos</strong>, sendo um deles o principal, que recebe as melhores horas do dia. Tarefas de rotina não contam como projeto. Projeto é o que tem começo, fim e muda alguma coisa.</p>

<div class="box trigger" data-tid="12-1"><span class="box-t">Gatilho</span><p><b>Se</b> quero começar um projeto novo e já tenho três ativos, <b>então</b> antes de dar o primeiro passo escolho qual dos três eu termino, estaciono ou mato, e escrevo essa troca na lista. Sem vaga, não entra.</p></div>

<h2>Projeto estacionado não é projeto abandonado</h2>
<p>O que trava muita gente no limite de três é a sensação de que tirar um projeto da lista ativa é desistir dele. Não é. Existe um terceiro estado entre "fazendo" e "morto": <strong>estacionado</strong>.</p>
<p>Estacionar direito tem método. Você escreve em poucas linhas: em que pé está, qual seria o próximo passo, e em que data vai reavaliar. Guarda num lugar só (uma nota chamada "estacionamento" resolve). Pronto. A cabeça solta, porque sabe que a informação não vai se perder e que existe uma data pra olhar de novo.</p>
<p>Sem esse ritual, o projeto parado fica rodando em segundo plano, gastando atenção e gerando culpa toda vez que você lembra dele. A diferença entre estacionar e abandonar é a nota escrita e a data de revisão. Na revisão, o projeto volta, continua estacionado ou morre de vez, com os critérios do capítulo 9.</p>

<div class="box ex"><span class="box-t">Na prática</span><p>Exemplo hipotético: um dono de loja está ao mesmo tempo trocando o sistema de frete, montando um canal de vídeos, reformando o depósito, avaliando uma marca nova e organizando as finanças pessoais. Tudo anda devagar. Ele escolhe: frete é o principal (afeta venda todo dia), finanças pessoais e marca nova ficam ativos em segundo plano. Vídeos e depósito vão pro estacionamento, cada um com três linhas de situação e revisão marcada pra daqui a 45 dias. Em três semanas o frete está resolvido e abre vaga. Antes, em três semanas, teria cinco projetos um pouco menos atrasados.</p></div>

<h2>Urgente não é sinônimo de importante</h2>
<p>Escolher o que fica ativo exige um critério. O mais útil que conheço é a <strong>matriz de Eisenhower</strong>, atribuída ao general e presidente americano e popularizada por Stephen Covey. Ela cruza duas perguntas que a gente costuma misturar: isso é importante (me aproxima do que eu quero)? Isso é urgente (tem prazo gritando)?</p>

<div class="table-wrap"><table>
<thead><tr><th>Quadrante</th><th>O que fazer</th><th>Exemplos de dono de negócio</th></tr></thead>
<tbody>
<tr><td><strong>1. Importante e urgente</strong></td><td>Fazer agora, você mesmo</td><td>Site fora do ar, cliente grande com problema sério, imposto vencendo amanhã</td></tr>
<tr><td><strong>2. Importante, não urgente</strong></td><td>Agendar e proteger o horário</td><td>Renegociar com fornecedor, treinar a equipe, documentar processo, revisar margem, saúde, tempo com a família</td></tr>
<tr><td><strong>3. Urgente, não importante</strong></td><td>Delegar, padronizar ou responder curto</td><td>A maior parte das mensagens e ligações, pedido de "uma reuniãozinha", dúvida que já tem resposta pronta</td></tr>
<tr><td><strong>4. Nem um nem outro</strong></td><td>Cortar</td><td>Relatório que ninguém lê, grupo de mensagens que só distrai, ajuste cosmético no site</td></tr>
</tbody>
</table></div>

<p>O quadrante que decide o seu futuro é o 2. É lá que moram as coisas que evitam os incêndios do quadrante 1. Só que o quadrante 2 nunca grita, então perde todo dia pro 3, que grita sem parar e parece trabalho. Quem passa o dia inteiro respondendo mensagem termina exausto, com a sensação de ter produzido muito, e com os projetos importantes no mesmo lugar.</p>
<p>A defesa que funciona é tratar o quadrante 2 como compromisso com hora marcada.</p>

<h2>O bloco de foco</h2>
<p>Bloco de foco é um período fechado, de 60 a 90 minutos (ajuste pro seu caso), dedicado a uma única coisa do projeto principal. As regras são poucas:</p>
<ul>
<li><strong>Hora fixa, na sua melhor hora.</strong> Pra maioria das pessoas é de manhã, antes de abrir mensagens. Abriu a caixa de entrada, o dia passa a ser dos outros.</li>
<li><strong>Uma tarefa definida antes.</strong> Decidir o que fazer dentro do bloco já gasta o bloco. Defina na véspera.</li>
<li><strong>Celular longe e notificações desligadas.</strong> Em outro cômodo, de preferência. O capítulo 11 explicou por quê: atrito.</li>
<li><strong>Papel do lado.</strong> Lembrou de outra coisa? Anota e volta. A anotação acalma a cabeça sem quebrar o foco.</li>
</ul>

<div class="box trigger" data-tid="12-2"><span class="box-t">Gatilho</span><p><b>Se</b> sentei pra trabalhar de manhã, <b>então</b> antes de abrir qualquer mensagem faço um bloco de 60 minutos na tarefa que defini na véspera pro projeto principal, com o celular em outro cômodo.</p></div>

<h2>A lista "não fazer"</h2>
<p>Lista de tarefas todo mundo tem. A lista que falta é a outra: coisas que você decidiu, de caso pensado, <strong>não fazer</strong>. Ela é a aplicação prática do custo de oportunidade. Cada item ali é tempo devolvido pro que importa.</p>
<p>O que entra: atividades do quadrante 4, tarefas do quadrante 3 que outra pessoa pode resolver, tipos de projeto que você sempre começa e nunca termina, tipos de pedido pra que você vai dizer não por padrão. Exemplos: "não abro canal de venda novo este semestre", "não faço reunião sem pauta escrita".</p>
<p>A vantagem de escrever é que você decide uma vez só. Sem a lista, cada pedido vira uma nova negociação com você mesmo, e nessas negociações quem está na sua frente costuma ganhar.</p>

<div class="box trigger" data-tid="12-3"><span class="box-t">Gatilho</span><p><b>Se</b> aparece uma ideia ou pedido novo no meio do dia, <b>então</b> anoto numa lista única de entrada e volto ao que estava fazendo. Só decido o destino dela (ativo, estacionado, não fazer) na revisão semanal, nunca na hora da empolgação.</p></div>

<div class="box warn"><span class="box-t">Armadilha</span><p>Usar o foco como desculpa pra ignorar incêndio de verdade ou pra sumir de quem depende de você. Quadrante 1 existe e fura a fila, é pra isso que ele serve. E tem o erro oposto: passar mais tempo organizando a lista, colorindo a matriz e ajustando o aplicativo de tarefas do que fazendo a tarefa. Sistema de foco bom cabe numa folha e toma dez minutos por semana.</p></div>

<section class="recap">
<h2>Fechamento</h2>
<h3>Em 3 linhas</h3>
<ol><li>Tocar tudo em paralelo atrasa tudo. Só o que termina rende, então limite o que está aberto: no máximo três projetos ativos, um principal.</li><li>O que não cabe vai pro estacionamento (com nota e data de revisão) ou pra lista "não fazer".</li><li>Proteja o importante que não grita: um bloco de foco por dia, na melhor hora, antes das mensagens.</li></ol>

<p>Escreva todos os projetos que você considera abertos. Marque um como principal e, no máximo, mais dois como ativos. Pra cada um dos outros, escreva uma linha com o próximo passo e uma data de revisão: eles estão oficialmente estacionados. Por último, defina a tarefa do bloco de foco de amanhã cedo.</p>
</section>

<p class="lead">Piloto com vinte anos de cabine lê uma lista em voz alta antes de decolar. Não é porque esqueceu como se pilota. É porque sabe que saber fazer não impede ninguém de pular um passo numa terça-feira ruim.</p>

<h2>Dois tipos de erro</h2>
<p>Atul Gawande, cirurgião e autor de um livro inteiro sobre checklists, separa as falhas em dois grupos. O primeiro é o erro de ignorância: a gente erra porque ninguém sabe ainda como fazer direito. O segundo é o erro de inépcia: o conhecimento existe, você tem, e mesmo assim não aplicou.</p>
<p>No dia a dia de um negócio, quase todo prejuízo evitável é do segundo grupo. A campanha foi pro ar com o produto zerado no estoque. O preço subiu com uma casa decimal errada. O boleto foi pago duas vezes. A atualização do site rodou sem ninguém conferir se o backup da noite tinha funcionado.</p>
<p>Ninguém ali precisava de curso. Precisava de uma lista de quatro linhas e do hábito de olhar pra ela. Gawande ajudou a levar essa ideia da aviação pra sala de cirurgia, um lugar cheio de gente muito treinada que, como todo mundo, esquece o básico quando está sob pressão.</p>

<div class="box key"><span class="box-t">Ideia central</span><p>Checklist não é muleta pra quem não sabe. É proteção pra gente competente, em tarefa conhecida, num dia ruim. Ele cuida do erro burro pra sua cabeça ficar livre pro problema difícil.</p></div>

<h2>Como fazer um checklist que alguém usa de verdade</h2>
<p>Gawande descreve dois formatos. No <strong>lê e faz</strong>, você executa cada item conforme lê, como numa receita. Serve pra tarefa rara, em que ninguém lembra a ordem. No <strong>faz e confere</strong>, você trabalha de memória e, num ponto de pausa definido, para e confere se nada ficou pra trás. Serve pra tarefa que você faz toda semana.</p>
<p>As regras de construção são poucas:</p>
<ul>
<li>Curto. Se passa de uma tela de celular, ninguém lê, só rola.</li>
<li>Só entra o passo que dói quando é pulado e que as pessoas de fato pulam. "Abrir o computador" não é item.</li>
<li>Tem um momento exato de uso: antes de publicar, antes de pagar, antes de enviar.</li>
<li>Frase simples, começando com verbo, que dá pra responder com sim ou não.</li>
<li>Nasce de erro real, não de imaginação. Testa uma semana e corta o que sobrou.</li>
</ul>

<div class="table-wrap"><table>
<thead><tr><th>Tarefa que se repete</th><th>Erro burro típico</th><th>Item do checklist</th></tr></thead>
<tbody>
<tr><td>Ligar campanha de anúncio</td><td>Produto sem estoque ou link quebrado</td><td>Abri o link no celular e o produto tem estoque?</td></tr>
<tr><td>Alterar preços em massa</td><td>Vírgula no lugar errado</td><td>Conferi 3 produtos na página depois de salvar?</td></tr>
<tr><td>Pagar fornecedor</td><td>Pagamento duplicado</td><td>Procurei esse valor no extrato dos últimos 10 dias?</td></tr>
<tr><td>Atualizar o site</td><td>Backup que não existe</td><td>Vi o arquivo de backup de hoje e o tamanho dele?</td></tr>
<tr><td>Contratar alguém</td><td>Combinado só de boca</td><td>Função, salário e data de início estão por escrito?</td></tr>
</tbody>
</table></div>

<div class="box ex"><span class="box-t">Na prática</span><p>Imagine uma loja que já queimou verba anunciando produto esgotado duas vezes no mesmo trimestre. O dono cola quatro perguntas na tela de quem liga campanha: estoque conferido, preço conferido na página, cupom testado em janela anônima, link aberto no celular. Três minutos por campanha. O erro não depende mais de alguém estar atento naquele dia.</p></div>

<div class="box trigger" data-tid="13-1"><span class="box-t">Gatilho</span><p><b>Se</b> eu cometer o mesmo erro bobo pela segunda vez, <b>então</b> abro o bloco de notas na hora e escrevo a pergunta de sim ou não que teria evitado, e colo no checklist daquela tarefa.</p></div>

<div class="box warn"><span class="box-t">Armadilha</span><p>Checklist engorda. Cada susto vira um item novo e em seis meses você tem trinta linhas que todo mundo marca sem ler. Aí ele passa a dar sensação de segurança sem dar segurança, que é pior do que não ter. Item que nunca pegou erro nenhum em meses sai da lista. E checklist não substitui julgamento: ele garante o piso, não o teto.</p></div>

<h2>Decisão importante na hora boa do dia</h2>
<p>Aqui é regra de bolso, não ciência. Os estudos mais famosos sobre "cansaço de decisão" são contestados e eu não vou me apoiar neles. Eu me apoio numa coisa que você consegue verificar sozinho: a sua cabeça tem hora melhor e hora pior, e você provavelmente já sabe qual é qual.</p>
<p>Pra muita gente a hora boa é de manhã. Pra alguns é tarde da noite. O horário em si importa pouco. O que importa é parar de gastar a hora boa respondendo mensagem e deixar a decisão de contrato pra hora em que você só quer que o dia acabe.</p>
<p>Faça o teste por uma semana: anote quando tomou decisões das quais se arrependeu ou que precisou refazer. O padrão costuma aparecer rápido. Cansado, com fome, logo depois de uma discussão, no celular entre duas outras coisas.</p>

<div class="box trigger" data-tid="13-2"><span class="box-t">Gatilho</span><p><b>Se</b> aparecer uma decisão de dinheiro, contrato ou gente fora da minha hora boa ou com a cabeça quente, <b>então</b> escrevo "decido amanhã às 9h" na agenda e não respondo nada até lá.</p></div>

<p>Quase nada que chega às onze da noite precisa de resposta às onze da noite. Quando precisa de verdade, você vai saber, porque tem algo pegando fogo no sentido literal ou quase.</p>

<h2>Sono é ferramenta de decisão</h2>
<p>Não vou jogar número de horas em você. O que a pesquisa sobre privação de sono mostra de forma consistente é que dormir mal piora atenção, memória e julgamento. E tem um detalhe cruel que aparece com frequência nesses estudos: a pessoa com sono avalia mal o próprio estado. Ela acha que está rendendo bem.</p>
<p>A consequência prática é simples. Dia seguinte a noite mal dormida é dia de tarefa operacional: conferir, organizar, responder, executar o que já estava decidido. Não é dia de assinar, demitir, investir nem mandar aquele e-mail definitivo. Se a decisão for porta de uma via (capítulo 7), ela espera uma noite decente.</p>
<p>Tratar sono como item de trabalho soa estranho pra quem aprendeu que dormir pouco é sinal de empenho. Minha leitura: quem decide coisas caras pra viver está sendo pago pelo julgamento, não pelas horas acordado. Estragar o julgamento pra ganhar horas é troca ruim.</p>

<h2>Rotina mata microdecisão</h2>
<p>Toda escolha que se repete pode virar regra, e regra não precisa ser decidida de novo. Dia fixo pra pagar contas. Dia fixo pra pedido de reposição. Dois horários fixos pra e-mail. O mesmo café da manhã nos dias úteis. Uma política escrita pra pedido de desconto, em vez de negociar caso a caso com cada cliente e com a própria consciência.</p>
<p>Isso não é rigidez. É tirar do caminho as decisões que não merecem você, pra sobrar cabeça pras que merecem. A regra pode ser quebrada, claro, mas quebrar passa a ser a exceção que pede motivo, e não o padrão de todo dia.</p>
<p>Um bom jeito de achar candidatas: repare no que você decide de novo toda semana e que dá sempre mais ou menos na mesma resposta. Aquilo já é uma regra, só que você está pagando pedágio mental pra redescobrir toda vez. Escreva e pare de pensar no assunto. Os gatilhos do capítulo 11 são o formato natural pra isso.</p>

<h2>A revisão semanal de 30 minutos</h2>
<p>Se você for ficar com uma rotina só deste capítulo, fique com esta. Meia hora, mesmo dia, mesmo horário, com timer. É o momento em que você sai de dentro da semana e olha pra ela de fora. Sem isso, o urgente decide a sua agenda pra sempre.</p>

<div class="table-wrap"><table>
<thead><tr><th>Pergunta</th><th>Tempo</th></tr></thead>
<tbody>
<tr><td>O que andou de verdade nesta semana? (entregue, não "mexido")</td><td>5 min</td></tr>
<tr><td>O que travou, e o que destrava?</td><td>5 min</td></tr>
<tr><td>Números: caixa, vendas e um indicador da vez</td><td>5 min</td></tr>
<tr><td>O que está aberto e pode ser fechado, delegado ou morto?</td><td>5 min</td></tr>
<tr><td>Quais são as 3 entregas da semana que vem?</td><td>5 min</td></tr>
<tr><td>Em que blocos da agenda elas entram? (marcar agora)</td><td>5 min</td></tr>
</tbody>
</table></div>

<p>Dois cuidados. Primeiro: revisão não é hora de trabalhar. Se você abrir a planilha pra "só arrumar uma coisinha", a meia hora vira duas e na semana seguinte você desiste do ritual. Anota e segue. Segundo: três entregas são três. Quem lista onze prioridades não tem nenhuma.</p>

<div class="box trigger" data-tid="13-3"><span class="box-t">Gatilho</span><p><b>Se</b> for sexta às 16h (ou o horário fixo que eu escolhi), <b>então</b> fecho o e-mail, ligo um timer de 30 minutos e respondo por escrito as seis perguntas da revisão semanal.</p></div>

<section class="recap">
<h2>Fechamento</h2>
<h3>Em 3 linhas</h3>
<ol>
<li>A maioria dos prejuízos evitáveis vem de pular o básico que você já sabe. Checklist curto, nascido de erro real, resolve isso.</li>
<li>Decisão cara se toma na sua hora boa e depois de dormir direito. O resto espera até amanhã cedo.</li>
<li>Regra fixa elimina microdecisão, e a revisão semanal de 30 minutos impede o urgente de mandar na agenda.</li>
</ol>
<h3>Exercício de 5 minutos</h3>

<p class="lead">Quase todo problema do seu negócio tem nome e sobrenome. O fornecedor que atrasa, o funcionário que entendeu outra coisa, o sócio que quer ir pro outro lado. Você pode ter o melhor raciocínio do mundo: se ele não atravessa uma conversa, não vale nada.</p>

<h2>Posição é o que a pessoa pede. Interesse é por que ela pede.</h2>
<p>Roger Fisher e William Ury, no clássico de negociação <em>Como Chegar ao Sim</em>, fazem uma distinção que resolve metade das brigas: <strong>posição</strong> é a exigência declarada, <strong>interesse</strong> é a necessidade por trás dela. As pessoas brigam por posições. Os acordos saem dos interesses.</p>
<p>Tem uma história velha de curso de negociação que ilustra bem. Duas pessoas disputam a última laranja e, depois de muito desgaste, cortam no meio. Uma espreme a metade e joga a casca fora. A outra rala a casca pra um bolo e joga o miolo fora. Se alguém tivesse perguntado "pra quê?", as duas sairiam com tudo o que queriam.</p>
<p>Na vida real é parecido. O fornecedor exige pedido mínimo alto (posição). O que ele quer é previsibilidade pra produzir e diluir o frete (interesse). Talvez um compromisso de compra trimestral, com entregas menores, atenda os dois. O funcionário pede aumento (posição). O interesse pode ser uma conta específica, reconhecimento, ou sinal de que tem futuro ali. Cada um desses pede uma resposta diferente, e só uma delas é dinheiro.</p>

<div class="box ask"><span class="box-t">Pergunte-se</span><ul><li>O que essa pessoa está pedindo, e que problema dela isso resolve?</li><li>Tem outro jeito de resolver o mesmo problema que me custe menos?</li><li>Qual é o meu interesse de verdade aqui, por trás do que eu estou exigindo?</li></ul></div>

<div class="box trigger" data-tid="14-1"><span class="box-t">Gatilho</span><p><b>Se</b> alguém me fizer uma exigência que eu não posso ou não quero atender, <b>então</b> antes de responder sim ou não eu pergunto: "o que isso resolve pra você?".</p></div>

<h2>A navalha de Hanlon</h2>
<p>A navalha de Hanlon é uma regra de bolso antiga: não atribua a má-fé o que dá pra explicar por descuido, pressa ou falta de informação. Ela não é uma lei da natureza. É uma aposta estatística: na maioria das vezes, quem te prejudicou não estava pensando em você. Estava atrasado, entendeu errado, não sabia, tinha outra prioridade.</p>
<p>O valor prático é enorme. Quando você assume má-fé, entra em modo de guerra: responde atravessado, copia o chefe do outro, guarda rancor. Se a hipótese estava errada (e geralmente está), você acabou de criar um inimigo onde só existia um desatento. Se você começa pela hipótese do descuido e faz uma pergunta, o custo de estar errado é quase zero.</p>

<div class="box trigger" data-tid="14-2"><span class="box-t">Gatilho</span><p><b>Se</b> uma mensagem ou atitude de alguém me irritar, <b>então</b> antes de responder eu escrevo duas explicações que não envolvem má-fé e mando uma pergunta pra checar qual é a verdadeira.</p></div>

<div class="box warn"><span class="box-t">Armadilha</span><p>Hanlon não é ingenuidade. A navalha vale pra primeira vez. Descuido que se repete depois de um combinado claro já não é acidente, é padrão, e padrão se trata com consequência, não com mais compreensão. Regra de bolso: na primeira você pergunta, na segunda você realinha por escrito, na terceira você decide.</p></div>

<h2>Delegue resultado, não tarefa</h2>
<p>"Responda os e-mails dos clientes" é uma tarefa. "Nenhum cliente fica mais de quatro horas úteis sem resposta" é um resultado. Na primeira versão você contratou um par de mãos, e qualquer situação fora do roteiro volta pra sua mesa. Na segunda você contratou uma cabeça, que vai criar modelos de resposta, organizar a fila e te avisar quando o volume estourar.</p>
<p>Delegar resultado tem um preço, e é por isso que pouca gente faz: a coisa vai ser feita de um jeito diferente do seu. Às vezes pior, às vezes melhor, quase sempre diferente. Se você não aguenta isso, não delegou. Só terceirizou a digitação e continuou sendo o gargalo.</p>
<p>Minha leitura, não ciência: o nível de autonomia acompanha a experiência da pessoa naquela atividade. Quem está começando precisa da tarefa e do porquê. Quem já domina precisa do resultado e dos limites (orçamento, prazo, o que não pode acontecer). Dar só o resultado pra quem é novo é abandono. Dar passo a passo pra quem é experiente é insulto.</p>

<h2>O combinado claro tem quatro partes</h2>
<p>Boa parte do que a gente chama de "falta de comprometimento" é combinado malfeito. A reunião termina com "a gente precisa ver aquilo do frete" e todo mundo sai achando que outro alguém vai ver. Um combinado de verdade responde a quatro perguntas:</p>
<ol>
<li><strong>Quem?</strong> Um nome. "A equipe" não é um nome.</li>
<li><strong>O quê?</strong> A entrega, não a atividade.</li>
<li><strong>Até quando?</strong> Dia e hora. "Assim que der" não é prazo.</li>
<li><strong>Como eu sei que ficou pronto?</strong> O que vai existir no mundo quando acabar.</li>
</ol>

<div class="table-wrap"><table>
<thead><tr><th>Frase vaga</th><th>Frase pragmática</th></tr></thead>
<tbody>
<tr><td>"Precisamos ver aquilo do frete."</td><td>"Fulano, você me manda até quinta, 12h, a comparação de três transportadoras pra região Sul?"</td></tr>
<tr><td>"Dá uma olhada nisso quando puder."</td><td>"Preciso da sua resposta até amanhã, 17h. Se não der, me avisa hoje."</td></tr>
<tr><td>"Melhora esse atendimento."</td><td>"A partir de segunda, toda mensagem recebe resposta em até 4 horas úteis. Sexta a gente olha o relatório."</td></tr>
<tr><td>"O fornecedor ficou de resolver."</td><td>"O representante confirmou por escrito a troca do lote até dia 20. Dia 21 eu cobro."</td></tr>
<tr><td>"Vamos marcar alguma coisa."</td><td>"Terça, 10h ou 15h. Qual fica melhor?"</td></tr>
</tbody>
</table></div>

<div class="box ex"><span class="box-t">Na prática</span><p>Imagine uma loja em que o dono, ao fim de qualquer conversa com tarefa, manda uma mensagem no grupo com quatro linhas: quem, o quê, até quando, como sei que ficou pronto. Leva um minuto. Em poucas semanas o "achei que era você" some, e o que sobra de atraso passa a ter dono, o que torna a conversa seguinte muito mais curta.</p></div>

<div class="box trigger" data-tid="14-3"><span class="box-t">Gatilho</span><p><b>Se</b> uma reunião ou conversa terminar com tarefa no ar, <b>então</b> antes de sair eu escrevo no grupo: quem, o quê, até quando e como sei que ficou pronto.</p></div>

<h2>Conversa difícil, versão curta</h2>
<p>Conversa difícil adiada não some. Ela acumula juros, e quando finalmente acontece vem com seis meses de irritação junto, o que garante que vai dar errado. Problema pequeno falado cedo é uma conversa de cinco minutos. O mesmo problema falado tarde é uma demissão.</p>
<p>O formato que funciona cabe em quatro frases:</p>
<ol>
<li><strong>Fato observável.</strong> "Nas últimas três semanas, o fechamento do caixa chegou depois do meio-dia." Fato, não opinião (capítulo 2). "Você anda desleixado" é opinião e abre uma briga.</li>
<li><strong>Impacto.</strong> "Com isso eu pago fornecedor sem saber o saldo."</li>
<li><strong>Pedido.</strong> "Preciso dele até as 10h."</li>
<li><strong>Pergunta.</strong> "O que está atrapalhando?" E aí você cala a boca e escuta, porque pode existir um motivo que muda tudo.</li>
</ol>
<p>Em particular, e por voz sempre que der. Texto escrito perde o tom e o outro lê com o pior tom possível.</p>

<div class="box key"><span class="box-t">Ideia central</span><p>Ser pragmático com gente é parar de esperar que o outro adivinhe. Diga o que você viu, o que você precisa e até quando. Pergunte o que o outro precisa. O resto é ruído.</p></div>

<h2>Dizer não sem queimar a ponte</h2>
<p>Todo sim custa um não em outro lugar (capítulo 9), então você vai precisar dizer muito não. O problema é que a maioria de nós, pra não desagradar, diz "vou ver". O "vou ver" é um não com juros: o outro fica esperando, cobra, você enrola, e no final ele recebe o não do mesmo jeito, só que agora também te acha enrolado.</p>
<p>Um bom não tem três peças. O não em si, claro e no começo. O motivo verdadeiro em uma frase, sem tese. E uma porta, se ela existir de verdade: outra data, outra pessoa, outro formato.</p>
<p>Fica assim: "Não vou conseguir entrar nesse projeto. Estou com a agenda tomada até o fim do semestre por duas entregas que não posso atrasar. Se ainda fizer sentido em agosto, me procura que eu olho com calma." Sem desculpa inventada, porque desculpa inventada convida o outro a resolver a desculpa ("ah, mas a gente pode fazer no sábado").</p>
<p>Não rápido e honesto é um favor. Quem recebe consegue se virar e procurar outra saída. Quem recebe um talvez eterno fica preso esperando você.</p>

<section class="recap">
<h2>Fechamento</h2>
<h3>Em 3 linhas</h3>
<ol>
<li>Por trás de toda exigência tem um interesse. Pergunte qual é antes de brigar pela posição.</li>
<li>Comece pela hipótese do descuido, não da má-fé. Mas padrão repetido depois de combinado claro pede decisão, não paciência.</li>
<li>Combinado tem quem, o quê, até quando e como sei que ficou pronto. Sem os quatro, é só uma esperança compartilhada.</li>
</ol>

</section>

<template id="ch-15">
<p class="lead">Você deu um desconto agressivo, vendeu bem e concluiu que foi uma jogada genial. Pode ter sido. Também pode ter sido a semana do pagamento, o concorrente sem estoque e um pouco de sorte. Se foi isso, você acabou de aprender a lição errada, e vai repetir.</p>

<h2>O erro de julgar a decisão pelo resultado</h2>
<p>Annie Duke, ex-jogadora profissional de pôquer e autora de <em>Thinking in Bets</em>, deu nome a esse vício: <strong>resulting</strong>. É avaliar a qualidade de uma decisão olhando só pro que aconteceu depois. Deu certo, então foi inteligente. Deu errado, então foi burrice.</p>
<p>Ela abre o livro com uma final de Super Bowl. Nos segundos finais, perto da linha de gol, o técnico chamou uma jogada de passe em vez de corrida. A bola foi interceptada, o time perdeu e a imprensa tratou aquilo como uma das piores decisões da história do esporte. O argumento de Duke é que a escolha era defensável pelo que se sabia na hora. O que foi péssimo foi o resultado. Se o passe tivesse sido completado, a mesma decisão teria virado genialidade.</p>
<p>O pôquer ensina isso na marra. Você joga a mão certa e perde. Joga errado e ganha. Quem ajusta o jogo a cada resultado quebra rápido. A vida de quem toca negócio parece muito mais com pôquer do que com xadrez: tem informação escondida e tem sorte. Comprar estoque, contratar, entrar num canal novo, tudo isso é aposta (capítulo 5).</p>

<div class="box key"><span class="box-t">Ideia central</span><p>Decisão e resultado são coisas diferentes. Você controla a qualidade da primeira. O segundo tem uma parte que é do acaso. Quem mistura os dois aprende errado com a própria experiência.</p></div>

<h2>A matriz dos quatro quadrantes</h2>
<p>Cruzando qualidade da decisão com resultado, saem quatro situações. Duas são fáceis de ler. As outras duas são onde o dinheiro se perde.</p>

<div class="table-wrap"><table>
<thead><tr><th></th><th>Resultado bom</th><th>Resultado ruim</th></tr></thead>
<tbody>
<tr><td><strong>Decisão boa</strong></td><td>Mérito. Repita o processo.</td><td>Azar. Não mexa no processo por causa disso.</td></tr>
<tr><td><strong>Decisão ruim</strong></td><td>Sorte. O quadrante mais perigoso: ensina a lição errada.</td><td>Merecido. Dói, mas pelo menos ensina certo.</td></tr>
</tbody>
</table></div>

<p>O quadrante da sorte é o traiçoeiro. Você contratou sem checar referência e a pessoa se revelou ótima. Conclusão tentadora: "eu tenho faro pra gente". Na próxima, o faro falha e custa seis meses. O processo era ruim desde o começo. Só demorou pra cobrar.</p>
<p>O quadrante do azar é o injusto. Você comprou estoque pra alta temporada com base em três anos de histórico, margem de segurança e pedido parcelado. A temporada veio fraca por um motivo que ninguém previa. Conclusão tentadora: "nunca mais compro adiantado". E assim você joga fora um processo bom por causa de uma rodada ruim.</p>

<div class="box trigger" data-tid="15-1"><span class="box-t">Gatilho</span><p><b>Se</b> um resultado muito bom me der vontade de repetir a dose em tamanho maior, <b>então</b> antes eu escrevo em duas colunas o que ali foi decisão minha e o que foi sorte ou contexto.</p></div>

<div class="box warn"><span class="box-t">Armadilha</span><p>"Foi azar" vira desculpa universal com muita facilidade. Se todo resultado ruim seu é azar e todo resultado bom é mérito, isso não é análise, é ego. O único jeito honesto de saber se a decisão era boa é ter registrado, antes, o que você sabia e o que esperava. Sem registro, a memória reescreve tudo a seu favor.</p></div>

<h2>O registro de decisão</h2>
<p>A memória não guarda o que você pensava. Ela reconstrói, já sabendo o final. Os psicólogos chamam isso de viés de retrospectiva: depois que a coisa acontece, parece que sempre foi óbvia. "Eu sabia que ia dar errado." Não sabia. Se soubesse, não tinha feito.</p>
<p>O remédio é sem graça e funciona: escrever antes. Um registro de decisão leva cinco minutos e tem sempre os mesmos campos.</p>

<div class="table-wrap"><table>
<thead><tr><th>Campo</th><th>O que escrever</th></tr></thead>
<tbody>
<tr><td>Data e decisão</td><td>Uma frase. "Contratar um segundo atendente em meio período."</td></tr>
<tr><td>Alternativas descartadas</td><td>O que mais eu considerei e por que não foi.</td></tr>
<tr><td>Por que escolhi esta</td><td>Os dois ou três fatos que pesaram (fato, não sensação).</td></tr>
<tr><td>O que eu espero</td><td>Com número e prazo. "Tempo de resposta abaixo de 4h em 60 dias."</td></tr>
<tr><td>Quão certo estou</td><td>De 0 a 100, como no capítulo 2.</td></tr>
<tr><td>O que me faria voltar atrás</td><td>O sinal concreto de que eu errei.</td></tr>
<tr><td>Data de revisão</td><td>Já marcada na agenda.</td></tr>
</tbody>
</table></div>

<p>Não é pra registrar tudo. Escolher a cor do botão não merece diário. Regra de bolso: se envolve dinheiro relevante, gente, contrato ou porta de uma via (capítulo 7), registra. Outra régua que ajuda: se isso ainda vai importar daqui a três meses, vale os cinco minutos.</p>
<p>Um efeito colateral aparece logo: o ato de preencher já melhora a decisão. Quando você tenta escrever "o que eu espero, com número e prazo" e não sai nada, descobriu que estava decidindo no escuro. Quando o campo de alternativas fica vazio, descobriu que só olhou uma opção.</p>

<div class="box ex"><span class="box-t">Na prática</span><p>Imagine o dono de uma loja online decidindo entrar num marketplace novo. Registro: "Entrar com os 30 produtos mais vendidos. Descartei entrar com o catálogo todo (trabalho demais pra testar). Espero 40 pedidos por mês em 90 dias, com margem líquida positiva depois da comissão. Confiança: 60. Volto atrás se em 90 dias ficar abaixo de 15 pedidos ou a margem der negativa. Revisão: dia 10, daqui a três meses." Quando a data chega, não tem discussão com a própria memória. Está escrito.</p></div>

<div class="box trigger" data-tid="15-2"><span class="box-t">Gatilho</span><p><b>Se</b> eu estiver prestes a bater o martelo numa decisão de dinheiro, contratação ou contrato, <b>então</b> antes eu gasto 5 minutos preenchendo o registro de decisão, com expectativa em número e data de revisão na agenda.</p></div>

<h2>Revisão pós-ação: quatro perguntas</h2>
<p>O registro é o antes. A revisão pós-ação é o depois. O formato foi popularizado pelo exército americano, que precisava que as unidades aprendessem rápido entre uma operação e outra, e cabe em quatro perguntas:</p>
<ol>
<li><strong>O que eu esperava que acontecesse?</strong> (Está no registro. Sem registro, você vai inventar.)</li>
<li><strong>O que aconteceu de fato?</strong> Números e fatos, não impressões.</li>
<li><strong>Por que a diferença?</strong> Aqui entra a matriz: o que foi processo, o que foi acaso, o que era informação que eu podia ter buscado e não busquei.</li>
<li><strong>O que muda daqui pra frente?</strong></li>
</ol>
<p>A quarta pergunta é a que separa revisão de lamento. A resposta tem que virar uma coisa concreta: um item de checklist (capítulo 13), um gatilho novo (capítulo 11), uma regra, um critério de morte (capítulo 9). "Prestar mais atenção" não é resposta. Ninguém presta mais atenção por decreto.</p>
<p>Vale também quando deu certo. Revisar só o fracasso deixa o quadrante da sorte sem fiscalização. E se for em equipe, a regra é procurar causa, não culpado. No dia em que a revisão virar tribunal, as pessoas param de contar a verdade e o ritual morre.</p>

<div class="box trigger" data-tid="15-3"><span class="box-t">Gatilho</span><p><b>Se</b> uma campanha, projeto ou contratação chegar ao fim (bem ou mal), <b>então</b> marco 15 minutos em até uma semana pra responder por escrito: o que eu esperava, o que aconteceu, por que a diferença e o que muda.</p></div>

<h2>Calibragem: o seu 80 vale quanto?</h2>
<p>Com vinte ou trinta registros acumulados, o diário começa a render uma coisa que nenhum curso entrega: o retrato do seu próprio julgamento. Pegue todas as decisões em que você anotou confiança perto de 80. Se você fosse bem calibrado, umas oito em cada dez teriam saído como esperado. É o mesmo teste que Tetlock aplicava nos previsores dele (capítulo 5).</p>
<p>A maioria das pessoas descobre que é confiante demais, o que bate com o viés de excesso de confiança do capítulo 4. Tudo bem. Agora você tem o fator de correção: "quando eu sinto 90, a realidade entrega 70". Isso muda o tamanho das apostas que você topa fazer.</p>
<p>O diário mostra também onde você erra. Tem gente que acerta produto e erra gente. Tem quem acerte a direção e erre sempre o prazo. Saber o seu padrão diz onde pedir segunda opinião, onde colocar margem de segurança e onde você pode confiar no próprio taco e decidir rápido.</p>
<p>Nada disso exige sistema sofisticado. Um caderno ou uma nota no celular resolve. O que exige é a disciplina de escrever antes e a honestidade de reler depois.</p>

<div class="box trigger" data-tid="08-1"><span class="box-t">Gatilho</span><p><b>Se</b> eu for começar uma tarefa que não é de alto risco, <b>então</b> antes de abrir o arquivo eu defino um tempo máximo, ligo o cronômetro do celular e entrego o que estiver pronto quando ele tocar.</p></div>
<div class="box trigger" data-tid="08-2"><span class="box-t">Gatilho</span><p><b>Se</b> eu for pesquisar para comprar ou contratar algo, <b>então</b> antes de abrir a primeira aba eu escrevo de três a cinco critérios mínimos e fecho com a primeira opção que cumprir todos.</p></div>

<div class="box trigger" data-tid="09-2"><span class="box-t">Gatilho</span><p><b>Se</b> me pego defendendo um projeto com a frase "mas a gente já investiu tanto nisso", <b>então</b> paro e respondo por escrito: "se fosse começar hoje, do zero, com o que sei agora, eu entraria?". Se a resposta for não, marco pra mesma semana a conversa de encerramento.</p></div>
<div class="box trigger" data-tid="09-3"><span class="box-t">Gatilho</span><p><b>Se</b> vou começar um projeto novo que dura mais de duas semanas, <b>então</b> antes do primeiro dia de trabalho escrevo a frase "eu paro se até [data] não tiver [resultado medível]" e mando pra uma pessoa que vai me cobrar.</p></div>
<p class="kit-src"><a href="#/c/09">Reler o capítulo 9</a></p>

<div class="box trigger" data-tid="10-2"><span class="box-t">Gatilho</span><p><b>Se</b> uma discussão sobre "será que funciona?" passa de 15 minutos sem dado novo, <b>então</b> interrompo e pergunto: "qual o menor teste que responde isso até sexta-feira?". A gente sai da conversa com o teste marcado, não com mais uma opinião.</p></div>

<div class="box trigger" data-tid="11-1"><span class="box-t">Gatilho</span><p><b>Se</b> me pego dizendo "preciso começar a fazer X" pela segunda vez, <b>então</b> paro e reescrevo na hora como "se [deixa que eu percebo sem esforço], então [primeiro passo físico de menos de um minuto]", e anoto onde vou ver.</p></div>
<div class="box trigger" data-tid="11-2"><span class="box-t">Gatilho</span><p><b>Se</b> quero instalar um hábito novo, <b>então</b> escolho uma rotina que já faço todo dia sem falhar e escrevo: "depois que eu [rotina], eu [ação de no máximo 2 minutos]". Só aumento a ação depois de duas semanas sem furo.</p></div>

<div class="box trigger" data-tid="11-4"><span class="box-t">Gatilho</span><p><b>Se</b> alguém me pressiona a decidir na hora ("só vale hoje", "tem outro interessado"), <b>então</b> respondo "se precisa ser agora, a resposta é não; se puder ser amanhã, eu avalio". Oferta boa de verdade quase sempre sobrevive a 24 horas.</p></div>

<div class="box trigger" data-tid="12-3"><span class="box-t">Gatilho</span><p><b>Se</b> aparece uma ideia ou pedido novo no meio do dia, <b>então</b> anoto numa lista única de entrada e volto ao que estava fazendo. Só decido o destino dela (ativo, estacionado, não fazer) na revisão semanal, nunca na hora da empolgação.</p></div>

    '<li><b>iPhone (Safari):</b> botão Compartilhar, depois "Adicionar à Tela de Início".</li>'+
    '<li><b>Android (Chrome):</b> menu de três pontos, depois "Instalar app" ou "Adicionar à tela inicial".</li>'+
    '<li>Depois de aberto uma vez, o livro funciona sem internet. Seu progresso fica salvo neste aparelho.</li></ol></details>'+
    '<p class="foot">Texto original, escrito com IA e revisado. Conceitos creditados aos autores citados.<br><button id="reset">Zerar meu progresso</button></p>';
  bindToc($('#home-toc'));
  var rb=$('#reset'),armed=false;rb.onclick=function(){if(!armed){armed=true;rb.textContent='Toque de novo pra confirmar';setTimeout(function(){armed=false;rb.textContent='Zerar meu progresso'},4000);return}
    S.read={};S.pos={};S.last=null;save();renderHome();toast('Progresso zerado')};
  bar.innerHTML='<b>Inteligência Pragmática</b>';document.title='Inteligência Pragmática';prog.style.width='0';
  document.body.classList.remove('bar-hidden');
  window.scrollTo(0,keep?y:0)}

/* capítulo */
function paintDone(b){var r=!!S.read[cur];b.setAttribute('aria-pressed',String(r));b.innerHTML=r?'✓ Lido <small>· toque pra desmarcar</small>':'Marcar capítulo como lido'}
function renderChapter(id){var i=idx(id);if(i<0){location.replace('#/');return}
  var c=CH[i],tpl=document.getElementById('ch-'+id);cur=id;openedAt=Date.now();S.last=id;save();
  var prev=CH[i-1],next=CH[i+1];
  app.innerHTML='<header class="ch-head"><p class="eyebrow">'+esc(PARTS[c.part])+'</p><h1>'+esc(c.title)+'</h1>'+
    (c.sub?'<p class="sub">'+esc(c.sub)+'</p>':'')+
    '<p class="meta"><span>Capítulo '+esc(c.num)+' · '+mins(c.min)+' de leitura</span>'+(S.read[id]?'<span class="pill">✓ lido</span>':'')+'</p></header>'+
    '<article id="content"></article>'+
    '<footer class="ch-end"><button class="btn done"></button><div class="pn">'+
    (prev?'<a class="btn" href="#/c/'+prev.id+'"><small>← Anterior</small>'+esc(prev.title)+'</a>':'<span class="ph"></span>')+
    (next?'<a class="btn next" href="#/c/'+next.id+'"><small>Próximo →</small>'+esc(next.title)+'</a>':'<a class="btn next" href="#/"><small>Fim →</small>Voltar à capa</a>')+
    '</div></footer>';
  var art=$('#content');art.appendChild(tpl.content.cloneNode(true));
  $$('.box.trigger[data-tid]',art).forEach(function(b){var k=b.getAttribute('data-tid'),btn=document.createElement('button');
    btn.className='fav';btn.innerHTML=STAR;btn.setAttribute('aria-label','Salvar em Meus gatilhos');btn.setAttribute('aria-pressed',String(!!S.fav[k]));
    btn.onclick=function(){if(S.fav[k])delete S.fav[k];else S.fav[k]=1;save();
      $$('.box.trigger[data-tid="'+k+'"] .fav',art).forEach(function(x){x.setAttribute('aria-pressed',String(!!S.fav[k]))});
      toast(S.fav[k]?'Salvo em Meus gatilhos (na capa)':'Removido de Meus gatilhos')};
    b.appendChild(btn)});
  var d=$('.done');paintDone(d);d.onclick=function(){setRead(id,!S.read[id]);paintDone(d)};
  document.title=c.title+' · Inteligência Pragmática';
  window.scrollTo(0,0);
  var p=S.pos[id]||0;
  if(p>.03&&p<.97)requestAnimationFrame(function(){requestAnimationFrame(function(){window.scrollTo(0,p*maxScroll())})});
  if(io)io.disconnect();
  if('IntersectionObserver' in window){io=new IntersectionObserver(function(es){es.forEach(function(e){
    if(e.isIntersecting&&cur===id&&!S.read[id]&&Date.now()-openedAt>40000){setRead(id,true);paintDone(d)}})},{threshold:.6});io.observe(d)}
  onScroll()}

/* rolagem: barra de leitura, posição, esconder barra */
function maxScroll(){return Math.max(1,document.documentElement.scrollHeight-window.innerHeight)}
var lastY=0,tick=false,sv;
function onScroll(){tick=false;var y=window.scrollY;
  if(cur!==null){var end=$('.ch-end'),lim=end?Math.max(1,end.offsetTop-window.innerHeight*.75):maxScroll();
    var r=Math.max(0,Math.min(1,y/lim));prog.style.width=(r*100).toFixed(1)+'%';
    var c=CH[idx(cur)],left=Math.ceil(c.min*(1-r));
    bar.innerHTML='<b>'+esc(c.num)+' · '+esc(c.title)+'</b> · '+(r>=.995?'fim':Math.round(r*100)+'% · '+left+' min');
    S.pos[cur]=Math.max(0,Math.min(1,y/maxScroll()));clearTimeout(sv);sv=setTimeout(save,350);
    if(y>lastY+6&&y>140)document.body.classList.add('bar-hidden');else if(y<lastY-6||y<140)document.body.classList.remove('bar-hidden')}
  lastY=y}
window.addEventListener('scroll',function(){if(!tick){tick=true;requestAnimationFrame(onScroll)}},{passive:true});
window.addEventListener('pagehide',save);document.addEventListener('visibilitychange',function(){if(document.hidden)save()});

/* rotas */
function route(){closeDrawer();aa.classList.remove('open');var m=location.hash.match(/^#\/c\/([\w-]+)/);if(m)renderChapter(m[1]);else renderHome()}
window.addEventListener('hashchange',route);
applyTheme();applyFs();route();

/* offline */
if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0){
  navigator.serviceWorker.register('sw.js').then(function(reg){reg.addEventListener('updatefound',function(){var w=reg.installing;if(!w)return;
    w.addEventListener('statechange',function(){if(w.state==='installed'&&navigator.serviceWorker.controller)toast('Versão nova do livro disponível. Toque pra atualizar.',function(){location.reload()})})})}).catch(function(){})}
})();
</script>
</body>
</html>
