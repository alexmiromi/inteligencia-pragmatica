<style>
:root{

  --fs:18px;
  --bar-h:52px;
}
:root[data-theme="dark"]{
  --bg:#15130f;--surface:#1d1a15;--ink:#e9e3d6;--muted:#a0978a;--line:#2f2a22;
  --accent:#e8834a;--accent-ink:#1a120c;--accent-soft:#33221a;
  --key-bg:#2a2312;--key-bd:#c99a2e;--key-t:#e6bf5e;
  --tri-bg:#14261c;--tri-bd:#3fa470;--tri-t:#7fd3a4;
  --warn-bg:#2c1815;--warn-bd:#d0604a;--warn-t:#f09a88;
  --ex-bg:#14202d;--ex-bd:#4c8bcb;--ex-t:#8fbdea;
  --ask-bg:#1f1a2b;--ask-bd:#8d70c4;--ask-t:#bda6e6;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:calc(var(--bar-h) + 12px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;transition:background .2s,color .2s}
a{color:var(--accent)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
svg{display:block}

/* barra de leitura */
#progress{position:fixed;left:0;right:0;top:0;height:3px;z-index:50;background:transparent;pointer-events:none}
#progress span{display:block;height:100%;width:0;background:var(--accent);transition:width .08s linear}

/* barra do app */
#bar{position:fixed;top:0;left:0;right:0;z-index:40;height:calc(var(--bar-h) + env(safe-area-inset-top));
  padding:env(safe-area-inset-top) max(8px,env(safe-area-inset-right)) 0 max(8px,env(safe-area-inset-left));
  display:flex;align-items:center;gap:2px;background:var(--bg);border-bottom:1px solid var(--line);
  transition:transform .25s ease,background .2s}
body.bar-hidden #bar{transform:translateY(-100%)}
.ib{width:44px;height:44px;display:grid;place-items:center;border-radius:10px;color:var(--ink);flex:none}
.ib:active{background:var(--accent-soft)}
.ib svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ib.txt{font-family:var(--serif);font-size:19px;font-weight:600}
#bar-label{flex:1;min-width:0;padding:0 6px;font-size:13.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bar-label b{color:var(--ink);font-weight:600}
[data-theme="light"] .i-sun,[data-theme="dark"] .i-moon{display:none}

/* painel Aa */

  border:1px solid var(--line);border-radius:14px;padding:10px;box-shadow:0 10px 30px rgba(0,0,0,.18);display:none;width:220px}
#aa.open{display:block}

.seg{display:flex;gap:6px}
.seg button{flex:1;height:42px;border:1px solid var(--line);border-radius:10px;font-family:var(--serif);background:var(--bg)}
.seg button:active{background:var(--accent-soft)}
.seg .sm{font-size:15px}.seg .lg{font-size:22px}

.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:700;margin:0 0 10px}

.tagline{font-family:var(--serif);font-size:19px;color:var(--muted);margin:0 0 26px;font-style:italic}
.overall{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}

.overall p{margin:10px 0 14px;font-size:14px;color:var(--muted)}

.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:active{opacity:.85}
.btn small{font-weight:500;opacity:.85}

h2.sec{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:34px 0 10px;font-weight:700}

/* sumário */
.toc ol{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.toc li{display:flex;align-items:stretch;border-top:1px solid var(--line)}
.toc li:first-child{border-top:0}
.toc a{flex:1;min-width:0;display:flex;gap:12px;padding:13px 4px 13px 14px;text-decoration:none;color:var(--ink);align-items:baseline}
.toc .n{font-family:var(--serif);color:var(--muted);font-size:14px;width:22px;flex:none;font-variant-numeric:tabular-nums}
.toc .t{flex:1;min-width:0}
.toc .t b{display:block;font-weight:600;font-size:15.5px;line-height:1.3}
.toc .t span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.toc li.read .t b{color:var(--muted)}

.chk{width:52px;flex:none;display:grid;place-items:center}
.chk i{width:24px;height:24px;border-radius:50%;border:1.8px solid var(--line);display:grid;place-items:center;transition:all .15s}
.chk svg{width:14px;height:14px;stroke:var(--accent-ink);stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round;opacity:0}
li.read .chk i{background:var(--tri-bd);border-color:var(--tri-bd)}
li.read .chk svg{opacity:1;stroke:#fff}

#drawer{position:fixed;z-index:61;top:0;bottom:0;left:0;width:min(88vw,380px);background:var(--bg);transform:translateX(-102%);

.ch-head .sub{font-family:var(--serif);font-style:italic;color:var(--muted);font-size:18px;margin:0 0 14px}

.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:99px;background:var(--tri-bg);color:var(--tri-t);font-weight:650;font-size:12px}

article{font-family:var(--serif);font-size:var(--fs);line-height:1.72;overflow-wrap:break-word}
article p{margin:0 0 1.15em}
article .lead{font-size:1.14em;line-height:1.6;color:var(--ink)}

article ul,article ol{padding-left:1.3em;margin:0 0 1.15em}

.box{position:relative;margin:1.5em 0;padding:14px 16px 14px 18px;border-radius:12px;border-left:4px solid;font-family:var(--sans);font-size:.9em;line-height:1.55}
.box p{margin:0}.box p+p{margin-top:.6em}
.box ul{margin:0;padding-left:1.15em}
.box-t{display:block;font-size:11.5px;letter-spacing:.13em;text-transform:uppercase;font-weight:800;margin-bottom:6px}
.box.key{background:var(--key-bg);border-color:var(--key-bd)}.box.key .box-t{color:var(--key-t)}
.box.trigger{background:var(--tri-bg);border-color:var(--tri-bd);padding-right:52px}.box.trigger .box-t{color:var(--tri-t)}

.box.warn{background:var(--warn-bg);border-color:var(--warn-bd)}.box.warn .box-t{color:var(--warn-t)}
.box.ex{background:var(--ex-bg);border-color:var(--ex-bd)}.box.ex .box-t{color:var(--ex-t)}
.box.ask{background:var(--ask-bg);border-color:var(--ask-bd)}.box.ask .box-t{color:var(--ask-t)}
.fav{position:absolute;top:4px;right:4px;width:44px;height:44px;display:grid;place-items:center;color:var(--tri-t)}

.table-wrap{margin:1.6em -4px;overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:12px;background:var(--surface)}

/* fim do capítulo */
.ch-end{margin-top:36px;display:grid;gap:12px}
.ch-end .done[aria-pressed="true"]{background:var(--tri-bg);border-color:var(--tri-bd);color:var(--tri-t)}
.pn{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* meus gatilhos */
.favs{display:grid;gap:10px}
.favs .box{margin:0;font-size:15px}
.favs .from{display:block;margin-top:8px;font-size:12px}
.favs .from a{color:var(--muted)}
.empty{font-size:14px;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:14px 16px;margin:0}

details.install{margin-top:30px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px 16px;font-size:14.5px}
details.install summary{padding:10px 0;font-weight:650;cursor:pointer}

.foot{margin-top:26px;text-align:center;font-size:12.5px;color:var(--muted)}
.foot button{color:var(--muted);text-decoration:underline;padding:10px}

#toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translate(-50%,30px);z-index:70;background:var(--ink);color:var(--bg);
  padding:11px 16px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:all .25s;max-width:calc(100vw - 32px);text-align:center}

@media (min-width:760px){:root{--fs:19px}.table-wrap{margin-left:0;margin-right:0}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{#bar,#progress,.ch-end,#drawer,#scrim,.fav{display:none!important}main{padding-top:0}}
</style>

<template id="ch-00">
<p class="lead">Este livro foi feito pra ser usado, não admirado. Se daqui a um mês você não estiver fazendo pelo menos uma coisa diferente, ele falhou, por mais que você tenha gostado da leitura.</p>

<h2>O que você tem na mão</h2>
<p>São quinze capítulos curtos, mais um kit de consulta no final. Cada capítulo leva de sete a dez minutos e foi pensado pra caber num intervalo: fila, café, antes de dormir.</p>
<p>A ordem faz sentido (ver, pensar, decidir, fazer, sustentar), mas nenhum capítulo depende totalmente do anterior. Se um assunto está pegando fogo na sua vida agora, pule direto pra ele.</p>

<div class="table-wrap"><table>
<thead><tr><th>Se o seu problema hoje é...</th><th>Comece por</th></tr></thead>
<tbody>
<tr><td>Não sei se isso é verdade ou achismo</td><td>Capítulos 2 e 5</td></tr>
<tr><td>Trabalho muito e o problema não some</td><td>Capítulo 3</td></tr>
<tr><td>Demoro demais pra decidir</td><td>Capítulos 7 e 8</td></tr>
<tr><td>Tenho projeto demais aberto</td><td>Capítulos 9 e 12</td></tr>
<tr><td>Sei o que fazer e não faço</td><td>Capítulos 11 e 13</td></tr>
<tr><td>Discuto muito e testo pouco</td><td>Capítulo 10</td></tr>
<tr><td>O gargalo são as pessoas</td><td>Capítulo 14</td></tr>
<tr><td>Repito os mesmos erros</td><td>Capítulos 6 e 15</td></tr>
</tbody>
</table></div>

<h2>As caixas coloridas</h2>
<p>O texto corrido explica. As caixas são o que você vai querer achar de novo depois.</p>

<div class="box key"><span class="box-t">Ideia central</span><p>A frase do capítulo. Se você só lembrar de uma coisa, é esta.</p></div>

<div class="box trigger" data-tid="00-1"><span class="box-t">Gatilho</span><p><b>Se</b> eu vejo uma caixa verde como esta e o gatilho serve pra minha vida, <b>então</b> toco na estrela do canto pra guardar em "Meus gatilhos", na capa.</p></div>

<div class="box warn"><span class="box-t">Armadilha</span><p>Como a ideia do capítulo dá errado quando é usada no automático. Toda ferramenta boa tem um jeito burro de ser usada.</p></div>

<div class="box ex"><span class="box-t">Na prática</span><p>Um exemplo inventado, quase sempre de loja online, dinheiro ou família. Nenhum é caso real.</p></div>

<h2>Por que gatilho, e não conselho</h2>
<p>Conselho é "pense melhor antes de decidir". Gatilho é "se a decisão custa mais que tal valor, então espero 24 horas". O primeiro depende de você lembrar, estar descansado e ter força de vontade na hora. O segundo já vem com a hora e a ação definidas.</p>
<p>O capítulo 11 explica a pesquisa por trás desse formato. Por enquanto, a regra de uso é uma só: <strong>poucos gatilhos, usados de verdade</strong>. Três gatilhos rodando valem mais que quarenta favoritados.</p>

<div class="box warn"><span class="box-t">Armadilha</span><p>Ler este livro inteiro num fim de semana, concordar com tudo e não mudar nada. É o jeito mais comum de consumir esse tipo de conteúdo, e é exatamente o comportamento que o capítulo 1 critica.</p></div>

<h2>O ritmo que eu sugiro</h2>
<ol>
<li><strong>Um capítulo por dia</strong>, no máximo dois. Ler mais que isso vira maratona e nada assenta.</li>
<li><strong>Faça o exercício de 5 minutos</strong> do fim do capítulo antes de marcar como lido. Ele é a parte que funciona.</li>
<li><strong>Escolha no máximo um gatilho por capítulo</strong> e marque com a estrela. Se nenhum servir, não marque nenhum.</li>
<li><strong>Releia "Meus gatilhos" na capa</strong> toda manhã durante o primeiro mês. Leva um minuto.</li>
<li><strong>No fim, vá pro kit de bolso</strong> (capítulo 16), que tem o plano de 30 dias.</li>
</ol>

<template id="ch-01">
<p class="lead">Todo mundo conhece alguém brilhante que não sai do lugar. Lê tudo, entende tudo, explica tudo, e a vida continua travada. E conhece também alguém sem diploma nenhum que resolve qualquer encrenca que aparece. Este livro é sobre o que o segundo tem e o primeiro não.</p>

<h2>Dois tipos de esperteza</h2>
<p>A escola treina um tipo específico de inteligência: a de resolver problema que já vem pronto. O enunciado é claro, os dados estão todos ali, existe uma resposta certa e alguém vai corrigir depois.</p>
<p>A vida adulta não funciona assim. O problema chega mal definido, faltando informação, com prazo, com gente envolvida, e ninguém entrega gabarito. Às vezes você nem sabe se aquilo é um problema ou só um incômodo.</p>
<p>O psicólogo Robert Sternberg passou décadas estudando essa diferença. Na teoria dele, inteligência tem três faces: a <strong>analítica</strong> (comparar, avaliar, resolver problema formal), a <strong>criativa</strong> (lidar com o que é novo) e a <strong>prática</strong> (se virar no mundo real, adaptando-se ao ambiente, mudando o ambiente ou trocando de ambiente).</p>
<p>A terceira é a que menos aparece em boletim e a que mais aparece em resultado. Sternberg chama boa parte dela de conhecimento tácito: aquilo que ninguém ensina de forma explícita e que você aprende fazendo, errando e prestando atenção.</p>

<thead><tr><th>Aspecto</th><th>Inteligência de prova</th><th>Inteligência pragmática</th></tr></thead>
<tbody>
<tr><td>Problema</td><td>Vem definido</td><td>Você precisa definir</td></tr>
<tr><td>Informação</td><td>Completa</td><td>Faltando, e sempre vai faltar</td></tr>
<tr><td>Resposta</td><td>Uma certa</td><td>Várias aceitáveis, com custos diferentes</td></tr>

<tr><td>Erro</td><td>Perde ponto</td><td>Vira dado, se você olhar</td></tr>
<tr><td>Risco típico</td><td>Não saber</td><td>Saber e não fazer</td></tr>
</tbody>
</table></div>

<p>Nenhuma das duas é melhor no absoluto. Você quer um engenheiro de ponte com muita inteligência de prova. O ponto é que quem toca um negócio, uma família e uma vida financeira passa o dia inteiro na coluna da direita, usando ferramentas que foram afiadas pra coluna da esquerda.</p>

<h2>De onde vem o "pragmática"</h2>
<p>A palavra não é enfeite. O pragmatismo é uma escola de filosofia que nasceu nos Estados Unidos no fim do século XIX, com Charles Peirce, William James e John Dewey.</p>
<p>A ideia central, simplificando bastante: o sentido de uma ideia está nas consequências práticas dela. Se duas teorias diferentes levam você a agir exatamente do mesmo jeito em todas as situações, a diferença entre elas é só de vocabulário. James gostava de perguntar que diferença concreta faria, na vida de alguém, aquela ideia ser verdadeira.</p>
<p>Dewey levou isso pra educação e pra ação: pensar é um instrumento pra resolver situações problemáticas, e uma ideia se testa usando.</p>

<div class="box key"><span class="box-t">Ideia central</span><p>Inteligência pragmática é a capacidade de transformar o que você sabe em resultado no mundo real, com informação incompleta, tempo curto e gente no meio. A medida dela é o que muda depois que você age.</p></div>

<p>Isso tem uma consequência meio incômoda. Uma discussão interna que não altera nenhuma decisão é entretenimento. Pode ser um bom entretenimento, mas convém não chamar de trabalho.</p>

<div class="box trigger" data-tid="01-1"><span class="box-t">Gatilho</span><p><b>Se</b> eu estou há mais de dez minutos debatendo uma questão (sozinho ou com alguém), <b>então</b> pergunto em voz alta: "qual decisão muda dependendo da resposta?" e, se nenhuma muda, encerro o assunto.</p></div>

<h2>Inteligente não é o mesmo que eficaz</h2>
<p>Minha leitura, não ciência: gente inteligente tem três vícios caros.</p>
<p>O primeiro é <strong>confundir entender com resolver</strong>. Explicar por que o estoque vive furado dá uma sensação boa de domínio. O estoque continua furado.</p>
<p>O segundo é <strong>preferir o problema interessante ao problema importante</strong>. Montar uma automação elegante é mais gostoso do que ligar pro fornecedor que atrasa toda semana. Adivinha qual dos dois mexe mais no caixa.</p>
<p>O terceiro é <strong>racionalizar bem</strong>. Quanto mais articulada a pessoa, melhor a desculpa que ela constrói pra fazer o que já queria fazer. Inteligência sem disciplina de realidade vira advogada do próprio impulso.</p>

<div class="box ex"><span class="box-t">Na prática</span><p>Imagine uma loja online em que o dono passa três semanas comparando plataformas de e-mail marketing: planilha, teste grátis, vídeo de review. Enquanto isso, a base de clientes não recebe nada. Um concorrente menos sofisticado manda um e-mail feio, em texto puro, toda quinta-feira, e vende. O primeiro sabe mais sobre e-mail marketing. O segundo faz e-mail marketing.</p></div>

<p>Eficácia, no sentido deste livro, é só isto: a distância entre o que você queria que acontecesse e o que aconteceu, e o quanto você consegue encurtar essa distância de forma repetível.</p>

<div class="box warn"><span class="box-t">Armadilha</span><p>Pragmatismo não é "o que dá resultado rápido está certo". Atalho que quebra a confiança de cliente, funcionário ou família funciona mal, só que com atraso. Consequência de longo prazo também é consequência. Quem usa "sou pragmático" pra justificar trapaça ou preguiça de pensar está usando a palavra errada.</p></div>

<h2>As quatro perguntas pragmáticas</h2>
<p>O livro inteiro cabe em quatro perguntas. Os próximos capítulos são ferramentas pra responder cada uma melhor. Se você só levar isto daqui, já valeu.</p>

<h3>1. O que é verdade aqui?</h3>
<p>Antes de opinar, separar o que você verificou do que você acha. A maior parte das decisões ruins nasce de um "fato" que ninguém conferiu. É o assunto dos capítulos 2, 4 e 5.</p>

<h3>2. O que eu quero de verdade?</h3>
<p>Parece óbvia e quase ninguém responde. Você quer ter razão na discussão com o fornecedor ou quer a mercadoria entregue no prazo? Quer o projeto novo ou quer a sensação de começar coisa nova? Objetivo mal definido transforma qualquer esforço em desperdício bem executado. Capítulos 3 e 9.</p>

<h3>3. O que está sob meu controle?</h3>
<p>Os estoicos já batiam nessa tecla há uns dois mil anos, e continua valendo. Você não controla o algoritmo do marketplace, o dólar ou o humor do cliente. Controla sua margem de segurança, sua resposta, seu próximo movimento. Energia gasta fora desse círculo é energia que falta dentro dele.</p>

<h3>4. Qual é o próximo passo?</h3>
<p>Não o plano completo: o próximo passo físico. "Resolver a questão fiscal" não é um passo. "Mandar mensagem pro contador perguntando X" é. Um problema só anda quando alguém faz alguma coisa observável. Capítulos 10 a 13.</p>

<h2>Isso se treina</h2>
<p>A boa notícia na pesquisa de Sternberg é que inteligência prática não vem travada de fábrica como muita gente acha que o QI vem. Ela cresce com experiência, desde que a experiência seja digerida. Vinte anos de empresa podem ser vinte anos de aprendizado ou um ano repetido vinte vezes. A diferença está em parar pra olhar o que aconteceu e por quê.</p>
<p>Por isso o livro tem o formato que tem. Cada capítulo traz uma ideia, uma tabela pra consultar depois e alguns <strong>gatilhos</strong> no formato "se acontecer X, então faço Y". O capítulo 11 explica por que esse formato funciona melhor do que boa intenção. Por enquanto, confie e use.</p>
<p>Você não precisa de todos. Dois ou três gatilhos que entrem de verdade na sua rotina valem mais do que o livro inteiro sublinhado.</p>

<p class="lead">"As vendas caíram porque o frete está caro." Essa frase passa em qualquer reunião sem ninguém piscar. Ela tem um fato (caíram, se alguém conferiu), uma suposição (por causa do frete) e uma opinião (está caro) costurados como se fossem uma coisa só. Decidir em cima dela é decidir em cima de um terço de informação.</p>

<h2>O mapa não é o território</h2>
<p>Alfred Korzybski cunhou a frase que virou clichê por um bom motivo: o mapa não é o território. O que você tem na cabeça sobre o seu negócio, seu casamento ou sua saúde é um mapa. Simplificado, desatualizado em alguns pontos, desenhado em parte por você e em parte por gente que te contou coisas.</p>
<p>Mapa é indispensável. Ninguém opera direto na realidade bruta. O problema começa quando você esquece que é mapa e para de conferir com o terreno.</p>
<p>Dashboard é mapa. Relatório do gerente é mapa. A lembrança que você tem de "como o cliente costuma reagir" é mapa. A planilha de margem que alguém montou há dois anos com uma alíquota que já mudou é um mapa de um país que não existe mais.</p>

<div class="box key"><span class="box-t">Ideia central</span><p>Toda afirmação que chega até você é uma de três coisas: fato verificado, suposição ou opinião. Misturar as três é a origem mais comum de decisão ruim. Separá-las leva trinta segundos e quase ninguém faz.</p></div>

<h2>Os três baldes</h2>
<p><strong>Fato</strong> é o que foi observado e pode ser conferido por outra pessoa. "Vendemos 412 pedidos na semana passada, contra 530 na anterior" é fato, desde que alguém tenha olhado no sistema e não de cabeça.</p>
<p><strong>Suposição</strong> é uma explicação ou previsão que parece razoável e ainda não foi testada. "Caiu por causa do frete." Pode ser. Pode ser também o feriado, a campanha que acabou, o concorrente em promoção ou um erro no checkout.</p>
<p><strong>Opinião</strong> é juízo de valor. "O frete está caro." Caro comparado a quê, pra quem? Opinião não é inútil, a sua vale bastante no seu negócio. Só não pode entrar na conta disfarçada de dado.</p>

<div class="table-wrap"><table>
<thead><tr><th>Tipo</th><th>Exemplo</th><th>Teste rápido</th></tr></thead>
<tbody>
<tr><td>Fato</td><td>"A taxa de conversão foi de 1,1% em março"</td><td>Dá pra apontar a fonte e outra pessoa chegaria no mesmo número?</td></tr>
<tr><td>Suposição</td><td>"O cliente desiste por causa do prazo"</td><td>Que evidência derrubaria isso? Alguém já foi buscar?</td></tr>
<tr><td>Opinião</td><td>"Nosso site é confuso"</td><td>Começa com "eu acho"? Depende de gosto ou critério pessoal?</td></tr>
<tr><td>Fato de segunda mão</td><td>"O fornecedor disse que despachou"</td><td>É fato que ele disse. O despacho em si ainda é suposição.</td></tr>
</tbody>
</table></div>

<p>A última linha merece atenção. Boa parte do que chamamos de fato é, na verdade, o fato de que alguém falou. O funcionário disse que conferiu. O cliente disse que pagou. A agência disse que o anúncio está performando. Trate como pista, não como prova, até ver o rastreio, o comprovante, o relatório bruto.</p>

<div class="box trigger" data-tid="02-1"><span class="box-t">Gatilho</span><p><b>Se</b> vou tomar uma decisão que custa dinheiro ou tempo relevante, <b>então</b> escrevo as três ou quatro afirmações que sustentam a decisão e marco cada uma com F (fato que eu vi), S (suposição) ou O (opinião).</p></div>

<p>O exercício costuma ser meio humilhante. Decisões que pareciam sólidas aparecem apoiadas em um F e quatro S. Não significa que você não deva decidir. Significa que agora você sabe onde está pisando em chão e onde está pisando em palpite.</p>

<h2>Vá olhar na fonte</h2>
<p>A Toyota tem um princípio que se popularizou com o nome de genchi genbutsu: vá ao local e veja a coisa real. Problema na linha de montagem se entende na linha de montagem, não na sala de reunião.</p>
<p>Pra quem tem loja online, o chão de fábrica é o checkout, a caixa de entrada do atendimento, a bancada de expedição e a fatura do cartão. Dez minutos lendo as conversas reais dos clientes valem mais do que um resumo de uma hora.</p>

<div class="box ex"><span class="box-t">Na prática</span><p>Imagine uma loja em que o painel mostra carrinho abandonado subindo. A equipe supõe que é preço e propõe cupom. O dono resolve fazer uma compra de teste no celular, com dados móveis, e descobre que o botão de calcular frete some atrás do teclado em telas pequenas. Ninguém tinha olhado. O cupom teria custado margem e não resolvido nada.</p></div>

<p>Olhar na fonte tem custo, então não dá pra fazer com tudo. A regra de bolso: quanto mais cara ou irreversível a decisão, mais perto do dado bruto você precisa chegar. Pra decidir a cor do banner, o resumo serve. Pra trocar de transportadora, abra a planilha de entregas linha por linha.</p>

<div class="box trigger" data-tid="02-2"><span class="box-t">Gatilho</span><p><b>Se</b> alguém me traz uma conclusão ("o problema é X"), <b>então</b> pergunto "como você sabe?" e peço pra ver o dado, a tela ou a mensagem original antes de discutir a solução.</p></div>

<p>Pergunte sem tom de interrogatório. "Como você sabe?" não é acusação, é higiene. Com o tempo a equipe aprende a chegar já com a evidência na mão, e as reuniões encurtam.</p>

<h2>Quando a métrica mente</h2>
<p>Números parecem fato puro. Nem sempre. O economista Charles Goodhart observou algo que virou lei com o nome dele: quando uma medida vira meta, ela deixa de ser uma boa medida.</p>
<p>O mecanismo é simples. Uma métrica é útil porque anda junto com alguma coisa que importa. Quando você premia a métrica, as pessoas (e você mesmo) passam a mexer nela direto, pelo caminho mais curto, e ela se descola da coisa que importava.</p>
<ul>
<li>Meta de tempo de resposta no atendimento: o time responde rápido qualquer coisa e o cliente precisa escrever três vezes.</li>
<li>Meta de número de pedidos: sobe o volume com desconto que come a margem.</li>
<li>Meta de avaliações cinco estrelas: alguém começa a pedir nota só pra cliente que elogiou.</li>
<li>Meta pessoal de horas trabalhadas: você fica mais tempo na cadeira e produz o mesmo.</li>
</ul>

<div class="box warn"><span class="box-t">Armadilha</span><p>A reação errada a Goodhart é parar de medir e voltar pro feeling. Sem número você troca um mapa torto por mapa nenhum. O certo é desconfiar de métrica isolada: acompanhe sempre um par que se vigia (volume com margem, velocidade com resolução, tráfego com conversão) e de vez em quando confira a métrica contra a realidade que ela deveria representar.</p></div>

<div class="box ask"><span class="box-t">Pergunte-se</span><ul>
<li>Este número mede a coisa que eu quero ou só algo que costuma andar perto dela?</li>
<li>Se alguém quisesse bater essa meta trapaceando, como faria? Isso já está acontecendo?</li>
<li>Quando foi a última vez que conferi esse relatório contra o dado bruto?</li>
</ul></div>

<h2>Quão certo você está, de 0 a 100?</h2>
<p>Sobra a parte mais difícil: as suas próprias certezas. A sensação de certeza é um sentimento, não uma medição. Ela aparece igualzinha quando você está certo e quando está redondamente enganado.</p>
<p>Um truque barato é trocar "tenho certeza" por um número. De 0 a 100, quão confiante você está de que a queda foi por causa do frete? Se a resposta honesta é 60, você acabou de admitir que há 40% de chance de a causa ser outra. Isso muda o que faz sentido fazer: talvez valha um teste de uma semana antes de renegociar todos os contratos.</p>
<p>O número não precisa ser preciso. Ele serve pra duas coisas. Primeiro, te obriga a notar a diferença entre 95 e 60, que na fala viram o mesmo "certeza". Segundo, deixa rastro: se você anotar, daqui a alguns meses dá pra ver se os seus "90" acontecem nove em cada dez vezes ou só seis. O capítulo 5 aprofunda isso e o capítulo 15 mostra como registrar.</p>

<div class="box trigger" data-tid="02-3"><span class="box-t">Gatilho</span><p><b>Se</b> eu me ouço dizendo "com certeza", "óbvio" ou "todo mundo sabe", <b>então</b> paro e dou uma nota de 0 a 100 pra minha confiança e, se for menor que 80, digo qual checagem barata subiria esse número.</p></div>

<p>Vale também pra conversa com os outros. "Quão certo você está disso, de 0 a 100?" é uma pergunta que desarma. A pessoa que ia defender a tese até a morte costuma responder "uns 70", e de repente existe espaço pra investigar em vez de brigar.</p>

<p class="lead">O dono da loja chega na segunda-feira decidido: "precisamos de um sistema novo de atendimento". Já viu demonstração, já tem orçamento. Ninguém perguntou qual problema o sistema resolve. Três meses e uma mensalidade depois, os clientes continuam reclamando da mesma coisa, agora dentro de uma ferramenta mais bonita.</p>

<h2>Apaixonado pela solução</h2>
<p>Solução é sedutora. Tem nome, tem preço, tem data pra começar, dá pra mostrar pros outros. Problema é nebuloso, chato e às vezes aponta pra você mesmo.</p>
<p>Por isso a cabeça pula direto pra solução. Repare como as pessoas descrevem suas dificuldades: "preciso contratar alguém", "preciso de um ERP melhor", "preciso fazer anúncio no canal tal". Nenhuma dessas frases é um problema. São todas respostas pra uma pergunta que não foi formulada.</p>
<p>O teste é fácil. Pegue a frase "preciso de X" e pergunte: <strong>pra quê?</strong> Se a resposta for "pra responder cliente mais rápido", pergunte de novo: e por que hoje demora? Em duas ou três rodadas você sai de "comprar um sistema" e chega em algo como "metade das mensagens é gente perguntando onde está o pedido, porque o e-mail de rastreio cai no spam". Esse é um problema. E a solução dele talvez custe zero.</p>

<div class="box key"><span class="box-t">Ideia central</span><p>A qualidade da solução tem teto: a qualidade da definição do problema. Meia hora gasta entendendo o que realmente está errado economiza semanas resolvendo com capricho a coisa errada.</p></div>

<div class="box trigger" data-tid="03-1"><span class="box-t">Gatilho</span><p><b>Se</b> eu me pego dizendo "preciso de" seguido de uma ferramenta, contratação ou projeto, <b>então</b> escrevo antes a frase "o problema é que..." e só sigo se conseguir completá-la sem citar a solução.</p></div>

<h2>Sintoma e causa</h2>
<p>Dor de cabeça é sintoma. Pode ser sono, tela, desidratação, pressão alta ou algo pior. Analgésico resolve a dor de hoje em qualquer um dos casos, e é exatamente esse o perigo: aliviar o sintoma tira a urgência de procurar a causa.</p>
<p>Em negócio é igual. Caixa apertado é sintoma. Funcionário desmotivado é sintoma. Avaliação ruim é sintoma. Cada um tem meia dúzia de causas possíveis, com tratamentos diferentes e às vezes opostos.</p>

<div class="table-wrap"><table>
<thead><tr><th>Sintoma</th><th>Pergunta que abre</th><th>Causas prováveis</th></tr></thead>
<tbody>
<tr><td>Caixa sempre apertado</td><td>O dinheiro não entra, sai demais ou está parado?</td><td>Margem baixa, estoque encalhado, prazo de recebimento longo, retirada alta</td></tr>
<tr><td>Muita reclamação de atraso</td><td>Atrasa em qual etapa?</td><td>Separação lenta, transportadora, prazo prometido irreal, falta de estoque</td></tr>
<tr><td>Anúncio parou de dar retorno</td><td>Mudou o anúncio, a página ou o mercado?</td><td>Criativo cansado, página quebrada, concorrente mais barato, rastreio com defeito</td></tr>
<tr><td>Equipe erra sempre a mesma coisa</td><td>Eles sabem, conseguem e querem fazer certo?</td><td>Processo não escrito, ferramenta ruim, falta de treino, falta de consequência</td></tr>
<tr><td>Você trabalha muito e nada anda</td><td>Em que as horas foram gastas de fato?</td><td>Urgência alheia, projetos demais abertos, tarefa que devia ser delegada</td></tr>
</tbody>
</table></div>

<p>Note que a coluna do meio é sempre uma pergunta que divide o problema em pedaços. "Atrasa em qual etapa?" transforma uma névoa em quatro hipóteses que dá pra conferir com dado (e aqui volta o capítulo 2: conferir, não supor).</p>

<h2>Os 5 porquês, e onde eles falham</h2>
<p>A técnica vem da Toyota e é de uma simplicidade quase ofensiva: diante de um problema, pergunte "por quê?" e, pra cada resposta, pergunte de novo, até chegar em algo que você pode consertar na origem. Cinco é um número de referência, não uma regra.</p>

<div class="box ex"><span class="box-t">Na prática</span><p>Um cliente hipotético recebeu o produto errado. Por quê? O separador pegou o item do lado. Por quê? As duas embalagens são quase idênticas. Por quê ficam lado a lado? Porque o estoque está organizado por marca. Por quê? Porque foi assim que começou e ninguém mexeu. Correção na origem: separar fisicamente os itens parecidos e pôr etiqueta grande com o código. Correção no sintoma, a que a maioria faz: dar bronca no separador.</p></div>

<p>Repare pra onde a técnica empurra: do "quem errou" pro "o que no sistema permitiu o erro". Pessoa atenta também erra quando o processo é uma armadilha.</p>
<p>Agora os limites, porque ferramenta simples usada sem critério vira ritual:</p>
<ul>
<li><strong>Ela assume uma causa só.</strong> Problema real costuma ter várias causas somadas. Se a resposta a um "por quê" tiver dois ramos, siga os dois.</li>
<li><strong>Ela só encontra o que você já sabe.</strong> Cada resposta é uma suposição sua. Se você não conferir, a cadeia inteira pode ser ficção bem encadeada.</li>
<li><strong>Ela pode não ter fim.</strong> Pare quando chegar em algo que está sob seu controle e que, consertado, impede a repetição. "Porque o ser humano é falho" é profundo demais pra ser útil.</li>
</ul>

<div class="box warn"><span class="box-t">Armadilha</span><p>Investigar causa pode virar desculpa elegante pra não agir. Se o depósito está pegando fogo, apague primeiro e pergunte por quê depois. A ordem certa em crise é: estancar o sintoma, depois achar a causa, depois impedir a repetição. O erro é parar na primeira etapa, não começar por ela.</p></div>

<h2>O problema em uma frase</h2>
<p>Um bom jeito de saber se você entendeu um problema é tentar escrevê-lo em uma frase com esta cara: <strong>o que acontece, com que frequência ou tamanho, e o que isso custa</strong>.</p>
<p>"O atendimento está ruim" não passa. "Cerca de metade das mensagens da semana são perguntas sobre rastreio, e cada uma toma uns cinco minutos de alguém" passa. A segunda frase já sugere onde mexer e permite saber depois se melhorou.</p>
<p>Se você não consegue escrever a frase, ainda não tem um problema. Tem um incômodo. Incômodo se investiga, não se resolve.</p>

<div class="box ask"><span class="box-t">Pergunte-se</span><ul>
<li>Se este problema sumisse amanhã, o que eu veria de diferente? Como eu saberia?</li>
<li>Isso é problema pra quem? Pro cliente, pra equipe, pro caixa ou só pro meu ego?</li>
<li>Há quanto tempo isso acontece? O que mudou quando começou?</li>
</ul></div>

<h2>E se eu não fizer nada?</h2>
<p>É a pergunta mais subestimada da gestão. Todo problema tem uma trajetória caso você o ignore, e ela é uma de três: piora, fica igual ou some sozinho.</p>
<p>Se piora, tem prioridade. Se fica igual, compare o custo de conviver com o custo de consertar: muita coisa irritante é barata de aguentar e cara de arrumar. Se some sozinho (o pico de demanda sazonal, a fase difícil do filho, o bug que só afeta um navegador em extinção), o melhor movimento é esperar.</p>
<p>Gente que faz acontecer tem dificuldade com isso. Não fazer nada parece preguiça. Só que atenção é o recurso mais curto que você tem, e cada problema que você decide conscientemente não resolver libera espaço pra um que importa.</p>

<div class="box trigger" data-tid="03-2"><span class="box-t">Gatilho</span><p><b>Se</b> aparece um problema novo pedindo minha atenção, <b>então</b> antes de agir respondo por escrito: "o que acontece se eu não fizer nada por 30 dias?" e só coloco na lista se a resposta for cara.</p></div>

<h2>Antes de derrubar a cerca</h2>
<p>O contrário também acontece: você olha uma regra, um processo ou uma etapa que parece inútil e conclui que o problema é ela. G. K. Chesterton propôs uma parábola pra esse momento. Alguém encontra uma cerca no meio de uma estrada, sem função aparente, e quer arrancá-la. A resposta sensata: primeiro descubra por que ela foi posta ali. Quando souber, talvez eu deixe você tirar.</p>
<p>Aquela conferência dupla na expedição que atrasa tudo pode ter nascido depois de um mês desastroso de trocas. A cláusula esquisita no contrato pode ter custado caro a alguém. Ou a cerca pode ser lixo histórico mesmo. O ponto é que "não sei pra que serve" e "não serve pra nada" são afirmações diferentes, e só a primeira é fato.</p>

<div class="box trigger" data-tid="03-3"><span class="box-t">Gatilho</span><p><b>Se</b> vou eliminar um processo, regra ou etapa que parece inútil, <b>então</b> pergunto a quem está há mais tempo na operação por que aquilo existe, e só removo depois de ouvir a história.</p></div>

<section class="recap">
<h2>Fechamento</h2>
<h3>Em 3 linhas</h3>
<ol>
<li>"Preciso de X" é solução. Pergunte "pra quê?" até aparecer o problema, e escreva-o em uma frase com tamanho e custo.</li>
<li>Trate sintoma em emergência, mas procure a causa no sistema, não na pessoa. Os 5 porquês ajudam, desde que você confira cada resposta.</li>
<li>Alguns problemas não merecem solução e algumas cercas têm motivo. Pergunte antes o que acontece se não fizer nada.</li>
</ol>
<h3>Exercício de 5 minutos</h3>
<p>Escolha o projeto ou a compra que você está mais animado pra fazer. Escreva "o problema é que..." e complete sem mencionar a solução, incluindo frequência ou tamanho e o custo. Se não conseguir, anote qual dado falta e onde buscá-lo. Se conseguir, liste duas outras soluções possíveis pro mesmo problema, mesmo que piores.</p>
</section>

<template id="ch-04">
<p class="lead">Você não perde dinheiro por falta de inteligência. Perde porque o seu cérebro usa atalhos que funcionam bem pra atravessar a rua e mal pra assinar contrato. O pior: por dentro, a decisão enviesada tem exatamente a mesma cara da decisão boa.</p>

<h2>Dois sistemas, um cérebro</h2>
<p>Daniel Kahneman, que ganhou o Nobel de Economia pelo trabalho feito com Amos Tversky, popularizou uma divisão útil. O <strong>Sistema 1</strong> é rápido, automático, intuitivo, e trabalha sem você pedir. O <strong>Sistema 2</strong> é lento, deliberado, faz conta e cansa.</p>
<p>São metáforas, o próprio Kahneman avisa que não existem duas caixinhas no cérebro. Mas descrevem bem a experiência. Reconhecer a cara de raiva de um cliente é Sistema 1. Calcular a margem de um kit com três produtos e frete subsidiado é Sistema 2.</p>
<p>O Sistema 1 resolve a imensa maioria do seu dia, e resolve bem. O problema é que ele responde qualquer pergunta, inclusive as que não sabe. Quando a pergunta é difícil ("vale abrir um segundo canal de venda?"), ele troca por uma fácil sem avisar ("eu gosto da ideia?") e entrega a resposta com total confiança. O Sistema 2, preguiçoso, costuma só assinar embaixo.</p>

<div class="box key"><span class="box-t">Ideia central</span><p>Viés não se cura com força de vontade nem com saber que ele existe. Kahneman dizia que estudou o tema a vida inteira e continuava caindo. O que funciona é processo: uma pergunta fixa, uma checagem externa, uma regra decidida antes, no frio.</p></div>

<p>A lista de vieses catalogados passa de cem. Decorar é inútil. Abaixo estão os seis que, na minha leitura, mais custam dinheiro pra quem decide num negócio pequeno ou médio. O custo afundado, outro campeão, tem capítulo próprio (o 9).</p>

<h2>Os seis mais caros</h2>

<h3>1. Confirmação</h3>
<p>Depois que você forma uma opinião, passa a enxergar o que concorda com ela e a descontar o que discorda. Não é desonestidade, é o modo padrão. Você acha que o fornecedor novo é melhor, e aí cada entrega no prazo vira prova e cada atraso vira "caso isolado".</p>
<p>O antídoto é procurar ativamente o dado que te derrubaria. Se a tese é "esse produto vai vender", a pergunta útil é "o que eu esperaria ver se ele não fosse vender, e eu já estou vendo isso?".</p>

<h3>2. Ancoragem</h3>
<p>O primeiro número que aparece numa conversa puxa todos os seguintes pra perto dele, mesmo quando é arbitrário. Tversky e Kahneman mostraram isso em experimentos clássicos. Quem negocia sabe na prática: o representante abre com um preço de tabela alto, e o seu "desconto bom" passa a ser medido a partir dali, não a partir do que a coisa vale.</p>
<p>Vale pra você contra você mesmo. O preço que você pagou no estoque ancora o preço pelo qual aceita vender. O faturamento do melhor mês ancora o que parece "normal".</p>

<div class="box trigger" data-tid="04-1"><span class="box-t">Gatilho</span><p><b>Se</b> vou entrar numa negociação ou pedir um orçamento, <b>então</b> escrevo antes, num papel, o valor que considero justo e o meu limite, e só depois ouço o número do outro lado.</p></div>

<h3>3. Disponibilidade</h3>
<p>A gente julga a frequência de uma coisa pela facilidade de lembrar exemplos. O que é recente, dramático ou aconteceu com você pesa demais. Um único chargeback feio faz você endurecer a regra antifraude e recusar dezenas de pedidos bons. Um cliente barulhento nas redes parece "todo mundo está reclamando".</p>
<p>Antídoto: contar. Quantos casos, de quantos, em que período. Quase sempre o número é menor do que a sensação, e de vez em quando é maior, o que é pior ainda.</p>

<h3>4. Excesso de confiança</h3>
<p>As pessoas, em média, acham que sabem mais do que sabem e que suas previsões são mais precisas do que são. É um dos achados mais repetidos da área. Dono de negócio é especialmente vulnerável: otimismo acima da média é quase requisito pra abrir empresa, e sem ele ninguém abriria.</p>
<p>O problema não é ser otimista na ambição. É ser otimista na conta: projetar venda pelo cenário bom, estoque pelo giro ideal, caixa sem folga.</p>

<h3>5. Aversão à perda</h3>
<p>Perder dói mais do que ganhar a mesma quantia agrada. É um dos pilares da teoria da perspectiva, de Kahneman e Tversky. Na prática, você segura produto encalhado pra não "realizar o prejuízo", mantém o canal de venda que dá trabalho e pouco lucro porque "já tem cliente lá", e recusa um risco pequeno e bom porque a perda possível grita mais alto que o ganho provável.</p>
<p>Um jeito de neutralizar é reformular a pergunta tirando o ponto de partida: se eu não tivesse esse estoque hoje, compraria por esse preço? Se não, o mercado já te deu a resposta.</p>

<h3>6. Falácia do planejamento</h3>
<p>Kahneman e Tversky deram esse nome à tendência de subestimar prazo, custo e risco de um projeto, mesmo sabendo que projetos parecidos estouraram. Você planeja olhando pra dentro (as etapas, no melhor cenário) e ignora o histórico de fora.</p>
<p>Douglas Hofstadter resumiu com humor na lei que leva o nome dele: tudo demora mais do que você espera, mesmo quando você leva em conta a lei de Hofstadter.</p>

<div class="box ex"><span class="box-t">Na prática</span><p>Imagine a migração de plataforma de uma loja, estimada em seis semanas. O dono lista as etapas e todas parecem simples. Ninguém pergunta quanto tempo levaram as últimas três mudanças grandes de sistema na empresa. Se alguém olhasse, veria que todas levaram o dobro ou mais. O histórico é a melhor estimativa disponível e a mais ignorada. O capítulo 5 chama isso de taxa-base.</p></div>

<div class="box trigger" data-tid="04-2"><span class="box-t">Gatilho</span><p><b>Se</b> estou estimando prazo ou custo de um projeto, <b>então</b> procuro quanto levaram de verdade os dois ou três últimos projetos parecidos e uso esse número como ponto de partida, não a soma otimista das etapas.</p></div>

<h2>Tabela de consulta</h2>
<div class="table-wrap"><table>
<thead><tr><th>Viés</th><th>Como aparece</th><th>Antídoto</th></tr></thead>
<tbody>
<tr><td>Confirmação</td><td>Só vejo prova a favor do que já acho</td><td>Perguntar: que dado me faria mudar de ideia? Ir buscá-lo</td></tr>
<tr><td>Ancoragem</td><td>O primeiro número vira a régua</td><td>Anotar meu número antes de ouvir o do outro</td></tr>
<tr><td>Disponibilidade</td><td>Um caso marcante vira "sempre acontece"</td><td>Contar: quantos, de quantos, em quanto tempo</td></tr>
<tr><td>Excesso de confiança</td><td>Projeção só no cenário bom</td><td>Fazer cenário ruim por escrito e ver se o caixa aguenta</td></tr>
<tr><td>Aversão à perda</td><td>Seguro o que devia soltar</td><td>Se começasse do zero hoje, eu compraria isso?</td></tr>
<tr><td>Falácia do planejamento</td><td>Prazo e custo sempre estouram</td><td>Usar o histórico real de projetos parecidos</td></tr>
</tbody>
</table></div>

<h2>O que funciona contra viés</h2>
<p>Saber a lista acima ajuda menos do que parece. Você vai reconhecer os vieses com facilidade nos outros e continuar cego pros seus, que é mais um viés, aliás. O que a pesquisa e a prática sugerem que funciona é tirar a decisão de dentro da sua cabeça:</p>
<ul>
<li><strong>Escrever.</strong> Raciocínio no papel expõe buracos que o pensamento solto esconde. Se não dá pra escrever o motivo em três linhas, o motivo é uma sensação.</li>
<li><strong>Dormir.</strong> Decisão grande tomada no calor de uma boa reunião de vendas (ou de uma raiva) merece uma noite. O entusiasmo de amanhã é melhor conselheiro que o de hoje.</li>
<li><strong>Pedir o contra.</strong> Escolha alguém em quem você confia e peça explicitamente: "me diz por que isso é má ideia". Sem o pedido explícito, as pessoas tendem a concordar com o chefe.</li>
<li><strong>Decidir a regra antes.</strong> Limite de desconto, teto de investimento num teste, critério pra cortar produto. Regra feita no frio protege você de você no quente.</li>
</ul>

<div class="box trigger" data-tid="04-3"><span class="box-t">Gatilho</span><p><b>Se</b> estou empolgado com uma decisão grande e com vontade de fechar hoje, <b>então</b> escrevo o motivo em três linhas, mando pra uma pessoa de confiança pedindo "me diz por que é má ideia" e só fecho no dia seguinte.</p></div>

<div class="box warn"><span class="box-t">Armadilha</span><p>Intuição não é inimiga. Em áreas onde você tem muita repetição e feedback rápido (avaliar um produto do seu nicho, sentir um cliente problemático), seu Sistema 1 é um especialista treinado e merece respeito. Desconfie dele onde você tem pouca experiência, feedback lento ou muito dinheiro em jogo. Usar checklist de viés pra escolher o almoço é outro tipo de burrice.</p></div>

<section class="recap">
<h2>Fechamento</h2>
<h3>Em 3 linhas</h3>
<ol>
<li>O Sistema 1 responde tudo com confiança, inclusive o que não sabe, e de dentro não dá pra notar a diferença.</li>
<li>Seis vieses concentram o prejuízo: confirmação, ancoragem, disponibilidade, excesso de confiança, aversão à perda e falácia do planejamento.</li>
<li>Conhecer o viés não protege. Processo protege: escrever, dormir, pedir o contra e fixar regras no frio.</li>
</ol>

<p class="lead">Pergunte a dez pessoas que vão abrir um restaurante qual a chance de dar certo. Quase todas respondem algo perto de "muito alta". Agora pergunte quantos restaurantes do bairro fecharam nos últimos anos. As duas respostas não conversam, e é nesse buraco que mora boa parte das decisões ruins.</p>

<h2>O futuro não é sim ou não</h2>
<p>A maioria das pessoas pensa o futuro em dois estados: vai dar certo ou não vai. É confortável, porque dispensa conta. O problema é que quase nada na vida de quem decide é certeza. Fornecedor atrasa às vezes. Campanha funciona às vezes. Funcionário novo se adapta às vezes.</p>
<p>Pensar de forma pragmática é trocar o "vai ou não vai" por "qual a chance, e o que acontece em cada caso". Não precisa de estatística de faculdade. Precisa de três hábitos: olhar a taxa-base, fazer uma conta de padaria e cuidar do tamanho da aposta.</p>

<div class="box key"><span class="box-t">Ideia central</span><p>Você não controla o resultado, controla a qualidade da aposta. Uma aposta boa é aquela que você faria de novo cem vezes, mesmo sabendo que em algumas delas vai perder.</p></div>

<h2>Visão de dentro e visão de fora</h2>
<p>Kahneman e Tversky descreveram dois jeitos de prever. Na <strong>visão de dentro</strong>, você olha os detalhes do seu caso: o seu produto, o seu plano, a sua vontade. Na <strong>visão de fora</strong>, você ignora os detalhes por um minuto e pergunta: em casos parecidos com este, o que costuma acontecer?</p>
<p>A resposta da visão de fora se chama <strong>taxa-base</strong>. É a frequência com que aquele tipo de coisa dá certo no mundo, antes de você considerar qualquer particularidade sua.</p>
<p>O próprio Kahneman conta que participou de uma equipe que escrevia um livro didático. Todos estimaram que terminariam em cerca de dois anos. Quando ele perguntou a um colega experiente como tinha sido com equipes parecidas, a resposta foi desanimadora: muitas nunca terminaram, e as que terminaram levaram bem mais tempo. A equipe ouviu, achou interessante e seguiu com a estimativa original. O livro demorou muitos anos a mais.</p>
<p>O erro não foi ignorância. A informação estava na mesa. O erro foi achar que "o nosso caso é diferente". Quase todo mundo acha isso, e é justamente por isso que a taxa-base funciona tão bem.</p>

<div class="box trigger" data-tid="05-1"><span class="box-t">Gatilho</span><p><b>Se</b> eu estiver empolgado com um projeto novo e prestes a estimar prazo ou chance de sucesso, <b>então</b> antes de olhar meu plano eu escrevo a resposta para "das últimas cinco vezes que eu ou alguém parecido comigo tentou algo assim, quantas deram certo e quanto tempo levou?".</p></div>

<h3>Onde achar a taxa-base</h3>
<p>Raramente existe uma estatística pronta para o seu caso. Não tem problema. Taxa-base aproximada já vale muito mais que nenhuma. Fontes boas, em ordem de utilidade:</p>
<ul>
<li><strong>Seu próprio histórico.</strong> Dos últimos dez produtos que você lançou, quantos se pagaram? Das últimas contratações, quantas ficaram mais de um ano?</li>
<li><strong>Gente que já fez.</strong> Pergunte a três pessoas do seu ramo quanto tempo levou e quanto custou de verdade.</li>
<li><strong>O padrão do setor.</strong> Taxa de conversão típica, prazo típico de obra, atraso típico de importação.</li>
</ul>
<p>Depois de ter a taxa-base, aí sim você ajusta pelos detalhes do seu caso. Um pouco para cima, um pouco para baixo. A ordem importa: primeiro o número de fora, depois o ajuste. Quem começa pelos detalhes quase nunca volta para o número.</p>

<h2>Troque palavra vaga por número</h2>
<p>Philip Tetlock passou anos estudando gente que faz previsão. Ele descobriu que especialistas famosos erravam muito mais do que se imaginava, e que um grupo pequeno de pessoas comuns acertava de forma consistente. Chamou esses de superprevisores.</p>
<p>O que eles fazem de diferente não é mágico. Eles dão previsões em <strong>números</strong> (65%, não "provável"). Eles começam pela taxa-base. E eles <strong>atualizam aos poucos</strong>: quando chega informação nova, mexem na estimativa alguns pontos, em vez de ignorar a novidade ou virar a opinião do avesso.</p>
<p>O número obriga honestidade. "Acho que o fornecedor entrega" não pode ser cobrado depois. "Dou 60% de chance de entregar no prazo" pode, e ainda deixa claro que você precisa de plano para os outros 40%.</p>
<p>A tabela abaixo é regra de bolso minha, não ciência. Serve para você e sua equipe combinarem o que cada palavra quer dizer.</p>

<div class="table-wrap"><table>
<thead><tr><th>Quando você diz</th><th>Provavelmente quer dizer</th><th>Então precisa de</th></tr></thead>
<tbody>
<tr><td>"Com certeza"</td><td>90% ou mais</td><td>Plano B leve</td></tr>
<tr><td>"Muito provável"</td><td>75% a 90%</td><td>Plano B pronto</td></tr>
<tr><td>"Provável"</td><td>60% a 75%</td><td>Plano B detalhado</td></tr>
<tr><td>"Talvez", "pode ser"</td><td>40% a 60%</td><td>Tratar como cara ou coroa</td></tr>
<tr><td>"Difícil"</td><td>15% a 40%</td><td>Não contar com isso</td></tr>
<tr><td>"Quase impossível"</td><td>menos de 10%</td><td>Só checar se o estrago seria fatal</td></tr>
</tbody>
</table></div>

<div class="box trigger" data-tid="05-2"><span class="box-t">Gatilho</span><p><b>Se</b> eu me ouvir dizendo "acho que vai dar certo", "provavelmente" ou "deve funcionar" sobre algo que envolve dinheiro, <b>então</b> eu paro e digo um número de 0 a 100 em voz alta, e anoto esse número junto com a data.</p></div>

<h2>Valor esperado com conta de padaria</h2>
<p>Valor esperado é um nome pomposo para uma conta simples: chance de ganhar vezes quanto ganha, menos chance de perder vezes quanto perde. Não precisa de precisão. Precisa só saber se a aposta é boa, neutra ou ruim.</p>

<div class="box ex"><span class="box-t">Na prática</span><p>Imagine uma loja que pode comprar um lote de um produto novo por 10 mil. Se vender bem, o lucro é de 15 mil. Se encalhar, ela liquida e perde 6 mil. Olhando os últimos lançamentos parecidos, mais ou menos 4 em cada 10 venderam bem. Conta: 0,4 x 15 mil = 6 mil. 0,6 x 6 mil = 3,6 mil. Saldo: 2,4 mil positivos. A aposta é boa, mesmo com mais chance de perder do que de ganhar. Agora mude a taxa-base para 2 em cada 10: 3 mil contra 4,8 mil. Virou aposta ruim, com o mesmo produto e a mesma empolgação.</p></div>

<p>Repare em duas coisas. Primeiro, uma aposta pode ser boa mesmo quando o mais provável é perder, desde que o ganho compense. Segundo, o que decidiu tudo foi a taxa-base, não a qualidade do produto na sua cabeça.</p>
<p>A conta também mostra onde vale gastar energia. Se você não consegue aumentar a chance de acerto, talvez consiga diminuir o tamanho da perda: lote menor, fornecedor que aceita devolução, pré-venda. Mexer no lado ruim da conta costuma ser mais fácil que mexer no lado bom.</p>

<h2>O tamanho da aposta</h2>
<p>Valor esperado positivo não é licença para apostar tudo. A conta de padaria supõe que você vai poder jogar muitas vezes, e na média sair no lucro. Só que para jogar muitas vezes você precisa continuar vivo no jogo.</p>
<p>Uma aposta com 80% de chance de dobrar o caixa e 20% de quebrar a empresa tem valor esperado ótimo no papel. Faça cinco dessas em sequência e a chance de ter quebrado em alguma já passa de dois terços. Taleb bate nessa tecla há anos: o que importa primeiro é não ser eliminado.</p>
<p>Regra de bolso, não ciência: separe as apostas em dois tipos. As que, se derem errado, <strong>doem</strong>. E as que, se derem errado, <strong>quebram</strong>. Na primeira categoria, siga o valor esperado e aposte com frequência. Na segunda, não importa o quão boa a conta parece: reduza o tamanho até ela voltar para a primeira categoria, ou não entre.</p>

<div class="box warn"><span class="box-t">Armadilha</span><p>Número dá falsa sensação de rigor. "Tenho 73% de certeza" inventado na hora é só um palpite de gravata. O valor do número não está na precisão, está em poder conferir depois. Se você nunca volta para ver se seus 70% acontecem perto de 7 em cada 10 vezes, está só enfeitando o achismo.</p></div>

<div class="box trigger" data-tid="05-3"><span class="box-t">Gatilho</span><p><b>Se</b> eu for comprometer dinheiro, estoque ou prazo numa aposta única, <b>então</b> eu escrevo em uma linha "se der totalmente errado, eu perco X" e só sigo se conseguir dizer que X dói mas não quebra.</p></div>

<div class="box ask"><span class="box-t">Pergunte-se</span><ul><li>Qual a taxa-base disso, antes de considerar que o meu caso é especial?</li><li>Eu faria essa mesma aposta cem vezes seguidas?</li><li>Se perder, continuo no jogo?</li><li>Que informação nova me faria mudar o número, e em quanto?</li></ul></div>

<p class="lead">Pergunte a alguém como ter um casamento feliz e a resposta sai enrolada. Pergunte como destruir um casamento e a lista vem na hora: mentir, sumir, humilhar em público, nunca ouvir. A segunda pergunta é mais fácil de responder, e a resposta é mais útil.</p>

<h2>Pense de trás pra frente</h2>
<p>Charlie Munger, sócio de Warren Buffett por décadas, repetia um conselho que pegou emprestado do matemático Carl Jacobi: inverta, sempre inverta. Muitos problemas difíceis ficam mais simples quando você vira a pergunta de cabeça para baixo.</p>
<p>Em vez de "como faço minha loja crescer?", pergunte "como eu garantiria que ela quebrasse?". Em vez de "como ser um bom chefe?", pergunte "o que um chefe faz para que os bons peçam demissão?". A lista que sai é concreta, quase sempre curta, e costuma conter pelo menos um item que você está fazendo agora.</p>
<p>Por que funciona? Minha leitura: o sucesso tem muitas receitas possíveis e depende de sorte, então é difícil de enxergar. O fracasso é mais repetitivo. As empresas quebram por um punhado de motivos parecidos: acabou o caixa, dependia de um cliente só, o dono parou de olhar os números, brigou com o sócio. Como o fracasso tem menos variedade, ele é mais fácil de mapear e de evitar.</p>

<div class="box key"><span class="box-t">Ideia central</span><p>Evitar burrice é mais fácil e mais confiável do que buscar genialidade. Boa parte do resultado de longo prazo vem de não cometer os erros óbvios, de forma consistente, por muito tempo.</p></div>

<h3>Como inverter em três passos</h3>

<h2>O pré-mortem</h2>
<p>O psicólogo Gary Klein transformou a inversão em um ritual de equipe. O nome é pré-mortem, por oposição ao post-mortem: em vez de analisar o cadáver depois, você imagina a morte antes e pergunta do que o paciente morreu.</p>
<p>A sacada está num detalhe de formulação. Perguntar "o que pode dar errado?" produz respostas mornas. Ninguém quer ser o pessimista da sala, e o dono do projeto ouve tudo na defensiva. O pré-mortem muda o enunciado: <strong>o projeto já fracassou</strong>. É fato dado. A única tarefa é explicar por quê.</p>
<p>Essa mudança libera as pessoas. Apontar o problema deixa de ser deslealdade e passa a ser demonstração de inteligência. Aquela preocupação que o estagiário tinha e não falava aparece no papel.</p>

<h3>Passo a passo</h3>
<ol>
<li><strong>Junte quem vai executar.</strong> De três a oito pessoas. Sozinho também funciona, mas pior: você tem os mesmos pontos cegos que criaram o plano.</li>
<li><strong>Apresente o plano</strong> em cinco minutos, sem vender.</li>
<li><strong>Dê o enunciado:</strong> "Estamos daqui a seis meses. O projeto foi um desastre. Cada um escreve, em silêncio, por três minutos, os motivos."</li>
<li><strong>Rodada de leitura.</strong> Cada pessoa lê um motivo por vez, até as listas acabarem. Ninguém rebate. Alguém anota tudo.</li>
<li><strong>Escolha os três a cinco motivos</strong> mais prováveis ou mais graves.</li>
<li><strong>Para cada um, defina uma ação:</strong> prevenir, criar um sinal de alerta cedo ou preparar um plano B. Com nome de responsável e data.</li>
</ol>
<p>O ritual inteiro cabe em quarenta minutos. O silêncio no passo 3 não é frescura: se as pessoas falam antes de escrever, a primeira opinião contamina as outras e a lista fica pobre.</p>

<div class="box ex"><span class="box-t">Na prática</span><p>Imagine uma loja que vai trocar de plataforma de e-commerce na primeira semana de novembro. No pré-mortem, saem: "a integração com o estoque não ficou pronta", "os links antigos quebraram e o tráfego orgânico despencou", "migramos perto demais da data de maior venda e não deu tempo de consertar". Três ações: lista de redirecionamentos testada antes, migração antecipada para setembro e a loja antiga mantida no ar por trinta dias como plano de volta. Nenhuma dessas ideias é genial. Todas teriam sido esquecidas no otimismo do cronograma.</p></div>

<div class="box trigger" data-tid="06-2"><span class="box-t">Gatilho</span><p><b>Se</b> eu estiver para aprovar um projeto que dura mais de um mês ou custa mais do que eu gostaria de perder, <b>então</b> antes do sim eu marco quarenta minutos com quem vai executar e abro com a frase "daqui a seis meses isso deu errado, escrevam por quê".</p></div>

<h2>Via negativa: tirar antes de pôr</h2>
<p>Nassim Taleb popularizou o termo via negativa para uma ideia antiga: muitas vezes se melhora mais removendo do que acrescentando. E temos mais certeza sobre o que faz mal do que sobre o que faz bem.</p>
<p>Na prática, quando algo não vai bem, o instinto é adicionar. Mais uma ferramenta, mais um relatório, mais uma reunião, mais um canal de venda, mais um suplemento. Cada adição traz custo de manutenção e efeito colateral que você só descobre depois. Remover, em geral, tem menos surpresa.</p>
<p>Antes de perguntar "o que eu coloco?", pergunte "o que eu tiro?":</p>
<ul>
<li>Qual produto dá mais trabalho de suporte do que lucro?</li>
<li>Qual relatório ninguém lê?</li>
<li>Qual cliente consome um terço da sua paciência e uma fração pequena da receita?</li>
<li>Qual compromisso fixo na agenda você manteria se tivesse que marcar de novo hoje?</li>
</ul>
<p>Uma ressalva honesta: nem tudo que parece inútil é inútil. Se você não sabe por que algo existe, descubra antes de arrancar. O capítulo 3 tratou disso com a cerca de Chesterton.</p>

<h2>Sua lista de erros burros</h2>
<p>A inversão genérica ajuda. A versão pessoal ajuda mais. Cada pessoa tem um conjunto pequeno de erros que repete. Não são erros de ignorância, são erros que você já sabe que são erros e comete mesmo assim, em geral com pressa, cansado ou empolgado.</p>
<p>Exemplos comuns: contratar no aperto sem checar referência. Responder mensagem irritado. Fechar compra grande sem dormir uma noite. Confiar em "fica tranquilo" de fornecedor sem nada por escrito. Alterar algo importante na sexta à tarde.</p>
<p>Escreva os seus. De cinco a dez itens, em formato de "nunca" ou "sempre antes de". Deixe num lugar que você vê: nota fixada no celular, papel na gaveta. A lista não precisa ser inteligente. Ela precisa estar na sua frente na hora em que você está prestes a repetir o erro.</p>

<div class="box warn"><span class="box-t">Armadilha</span><p>Inversão e pré-mortem viram desculpa para nunca começar. Se a lista de riscos tem quarenta itens e todos parecem graves, você não fez análise, fez ansiedade por escrito. A regra é escolher de três a cinco riscos, dar uma ação para cada e seguir em frente. Risco sem ação atribuída é só lamento. E lembre que o objetivo é evitar o erro burro, não eliminar toda chance de falha: isso não existe.</p></div>

<div class="box trigger" data-tid="06-3"><span class="box-t">Gatilho</span><p><b>Se</b> eu perceber que cometi pela segunda vez o mesmo tipo de erro, <b>então</b> eu abro minha nota "erros burros" no celular e acrescento uma linha começando com "nunca" ou "sempre antes de", na mesma hora, antes de consertar o estrago.</p></div>

<template id="ch-07">
<p class="lead">Tem gente que passa três semanas escolhendo a ferramenta de e-mail marketing e resolve em uma tarde, no impulso, assinar um contrato de aluguel de cinco anos. O esforço foi gasto exatamente ao contrário do que deveria.</p>

<h2>Duas portas</h2>
<p>Jeff Bezos, numa carta aos acionistas da Amazon, separou as decisões em dois tipos. As de <strong>tipo 1</strong> são portas de uma via: você atravessa e não tem como voltar, ou voltar custa caríssimo. As de <strong>tipo 2</strong> são portas de duas vias: se não gostar do que encontrou, você abre de novo e volta.</p>
<p>O argumento dele é que a maioria das decisões é de duas vias, e que empresas, conforme crescem, passam a tratar todas como se fossem de uma. O resultado é lentidão, reunião demais e aversão a experimento. O erro oposto também existe, e é mais comum em empresa pequena: tratar porta de uma via com a leveza de quem troca a cor de um botão.</p>
<p>Então a primeira pergunta diante de qualquer decisão não é "qual a melhor opção?". É "que tipo de porta é esta?". A resposta define quanto tempo, quanta informação e quanta gente a decisão merece.</p>

<div class="box key"><span class="box-t">Ideia central</span><p>O cuidado com uma decisão deve ser proporcional ao custo de desfazê-la, não ao tamanho que ela parece ter nem ao nervoso que ela dá.</p></div>

<h2>Como medir a reversibilidade</h2>
<p>Poucas decisões são 100% reversíveis ou 100% definitivas. É uma régua. Para situar a sua, três perguntas bastam:</p>
<ul>
<li><strong>Quanto custa voltar atrás?</strong> Em dinheiro, em tempo e em desgaste com pessoas.</li>
<li><strong>Por quanto tempo dá para voltar?</strong> Algumas portas ficam abertas por trinta dias e depois trancam (período de teste, prazo de arrependimento, cláusula de saída).</li>
<li><strong>O que não volta nunca?</strong> Reputação, confiança de alguém, dados apagados, saúde, um prazo legal perdido.</li>
</ul>
<p>Se voltar custa pouco e a janela é longa, a porta é de duas vias, por mais importante que o assunto pareça. Preço de produto, texto de anúncio, layout de página, horário de atendimento, fornecedor secundário: tudo isso se testa e se desfaz.</p>
<p>Se alguma resposta à terceira pergunta aparecer, acenda o alerta. Demitir alguém, assinar sociedade, dar garantia pessoal em empréstimo, apagar base de dados, publicar algo em nome da empresa numa crise, mudar a família de cidade. Aqui a pressa custa caro.</p>

<thead><tr><th>Tipo de decisão</th><th>Velocidade e quem decide</th><th>Exemplo</th></tr></thead>
<tbody>
<tr><td>Duas vias, barata</td><td>Na hora. Quem está mais perto do problema.</td><td>Texto de anúncio, ordem dos produtos na vitrine</td></tr>
<tr><td>Duas vias, cara de testar</td><td>Dias. Responsável da área, avisando você.</td><td>Trocar transportadora, mudar política de frete</td></tr>
<tr><td>Uma via, com saída possível</td><td>Uma ou duas semanas. Você, depois de ouvir gente.</td><td>Contratar gerente, fechar contrato anual</td></tr>
<tr><td>Uma via, sem saída</td><td>O tempo que precisar, com prazo marcado. Você, com conselho de fora.</td><td>Sócio novo, vender a empresa, aval pessoal</td></tr>
</tbody>
</table></div>

<h2>A regra dos 70%</h2>
<p>Na mesma linha, Bezos sugere que a maioria das decisões deveria ser tomada com algo em torno de 70% da informação que você gostaria de ter. Se esperar os 90%, quase sempre você está lento demais.</p>
<p>O número não é medida científica, é uma âncora para lembrar duas coisas. A primeira: informação tem retorno decrescente. Os primeiros dados mudam muito a sua visão, os últimos quase nada, e custam o mesmo tempo para conseguir. A segunda: enquanto você pesquisa, o mundo anda. O concorrente lança, o fornecedor vende o lote para outro, o candidato bom aceita outra proposta.</p>
<p>A condição para decidir com 70% é ser bom em <strong>corrigir rápido</strong>. Quem decide cedo e percebe o erro cedo paga barato. Quem decide cedo e só olha o resultado seis meses depois paga o preço cheio. Velocidade de decisão sem velocidade de correção é só imprudência.</p>

<div class="box trigger" data-tid="07-1"><span class="box-t">Gatilho</span><p><b>Se</b> eu perceber que estou há mais de dois dias adiando uma decisão, <b>então</b> eu escrevo em uma linha "quanto custa desfazer isso e até quando dá para desfazer?", e se a resposta for "pouco" e "por um bom tempo", eu decido hoje com o que sei.</p></div>

<h2>Esperar também custa</h2>
<p>Adiar parece seguro porque o custo de esperar não chega em boleto. Mas ele existe. É a venda que não aconteceu enquanto o site novo não saía. É a equipe parada esperando sua resposta. É a cabeça ocupada com o assunto aberto, tirando atenção do resto.</p>
<p>Não decidir é uma decisão: a de manter tudo como está. Às vezes é a certa. O problema é quando ela é tomada por omissão, sem ninguém ter escolhido.</p>
<p>Uma prática simples: toda decisão pendente ganha uma <strong>data de decisão</strong>. Não é prazo para executar, é prazo para escolher. "Até sexta eu decido se troco de contador." Chegou sexta, você decide com o que tem, inclusive podendo decidir "não troco". O que não pode é o assunto ficar flutuando.</p>

<div class="box ex"><span class="box-t">Na prática</span><p>Imagine uma loja em dúvida entre dois sistemas de atendimento. O dono pesquisa há um mês, já viu doze vídeos e montou planilha comparativa. Ambos têm plano mensal, sem fidelidade, e exportam os dados. É porta de duas vias clássica. O custo de errar é um mês de assinatura e uma tarde de migração. O custo do mês de pesquisa foi o atendimento seguir bagunçado por trinta dias. A decisão certa era escolher qualquer um dos dois na primeira semana e reavaliar em trinta dias.</p></div>

<h2>Transforme uma via em duas</h2>
<p>A jogada mais valiosa do capítulo: muitas portas de uma via podem ser convertidas, pelo menos em parte, em portas de duas vias. Você paga um pouco mais ou anda um pouco mais devagar, e em troca compra o direito de voltar atrás.</p>
<ul>
<li><strong>Piloto.</strong> Em vez de trocar a operação inteira, troque uma parte. Uma categoria, uma região, uma semana.</li>
<li><strong>Contrato curto.</strong> Mensal em vez de anual, mesmo pagando mais. Inclua cláusula de saída. O desconto do plano anual é o preço que o fornecedor paga para trancar a sua porta.</li>
<li><strong>Período de experiência.</strong> Com funcionário, prestador, sócio em potencial. Um projeto pequeno juntos antes do compromisso grande.</li>
<li><strong>Backup antes de tudo.</strong> Cópia do banco, da planilha, do site, antes de qualquer alteração que apague ou sobrescreva. Backup testado, não backup que você acha que existe.</li>
<li><strong>Alugar antes de comprar.</strong> Equipamento, espaço, até uma cidade: more de aluguel antes de vender a casa.</li>
</ul>
<p>Quando nada disso é possível, a porta é de uma via de verdade. Aí entram as ferramentas mais pesadas dos capítulos anteriores: taxa-base, conta do tamanho da aposta, pré-mortem e uma noite de sono.</p>

<div class="box trigger" data-tid="07-2"><span class="box-t">Gatilho</span><p><b>Se</b> eu identificar que uma decisão é porta de uma via, <b>então</b> antes de decidir eu escrevo três formas de deixá-la mais reversível (piloto, prazo menor, cláusula de saída, backup) e pergunto à outra parte se aceita pelo menos uma.</p></div>

<div class="box warn"><span class="box-t">Armadilha</span><p>"É reversível" vira desculpa para decidir mal e sem pensar. Duas vias não significa custo zero: cada vai e volta gasta dinheiro, confunde a equipe e cansa o cliente. E cuidado com a porta que parece de duas vias mas tranca por acúmulo. Uma contratação ruim é reversível no primeiro mês. No décimo, a pessoa já está no meio de tudo e desfazer virou cirurgia. Se é para voltar atrás, volte cedo.</p></div>

<div class="box trigger" data-tid="07-3"><span class="box-t">Gatilho</span><p><b>Se</b> alguém da equipe me trouxer uma decisão barata e fácil de desfazer, <b>então</b> eu respondo "essa é sua, decide e me conta depois" em vez de dar minha opinião.</p></div>

<p class="lead">O anúncio ficou duas semanas na gaveta porque a foto "ainda não estava boa". Quando finalmente subiu, vendeu igual ao anterior, que tinha sido feito em vinte minutos. As duas semanas não compraram nada.</p>

<h2>Ninguém otimiza de verdade</h2>
<p>Herbert Simon ganhou o Nobel de Economia defendendo uma ideia que parece óbvia depois de dita: gente de verdade não tem tempo, informação nem cabeça para achar a melhor opção possível. Ele chamou isso de <strong>racionalidade limitada</strong>. A teoria econômica da época supunha um decisor que compara todas as alternativas e escolhe a ótima. Simon olhou para como as pessoas e as empresas decidem de fato e viu outra coisa.</p>
<p>O que fazemos, segundo ele, é definir um nível aceitável e pegar a primeira opção que passa desse nível. Ele deu nome a isso juntando duas palavras em inglês, satisfazer e bastar: <strong>satisficing</strong>. Em bom português, escolher o bom o suficiente.</p>
<p>O ponto de Simon não era que isso é preguiça. Era que, num mundo onde procurar custa, essa é a estratégia inteligente. A busca pela opção perfeita tem um preço, e esse preço quase nunca entra na conta.</p>

<div class="box key"><span class="box-t">Ideia central</span><p>A melhor decisão não é a que acha a melhor opção. É a que acha uma opção boa gastando pouco para procurar. O custo da busca faz parte do custo da escolha.</p></div>

<h2>Maximizador e satisficer</h2>
<p>O psicólogo Barry Schwartz pegou a ideia de Simon e estudou dois perfis. O <strong>maximizador</strong> precisa ter certeza de que escolheu o melhor. Compara tudo, lê todas as avaliações, e depois de comprar continua olhando se tinha algo melhor. O <strong>satisficer</strong> sabe o que precisa, acha algo que atende e para de procurar.</p>
<p>O que Schwartz relata é que maximizadores às vezes conseguem resultados objetivamente um pouco melhores, mas ficam menos satisfeitos com eles, sofrem mais para decidir e se arrependem mais. Conseguem o melhor e aproveitam pior.</p>
<p>Ninguém é uma coisa só. Você pode ser satisficer para roupa e maximizador para equipamento, ou para tudo que envolve a empresa. O trabalho é perceber onde o seu maximizador está ligado sem necessidade.</p>

<h2>Duas leis que ajudam a soltar</h2>
<h3>Pareto</h3>
<p>Vilfredo Pareto observou que uma parte pequena das causas costuma responder pela maior parte dos efeitos. Virou a regra 80/20. Os números exatos variam e não são lei da natureza, mas o desequilíbrio aparece em todo canto: poucos produtos fazem a maior parte do faturamento, poucos clientes geram a maior parte das reclamações, poucas páginas recebem a maior parte das visitas.</p>
<p>A consequência prática: o esforço para sair de "bom" para "perfeito" costuma ser maior que o esforço para sair do zero até "bom", e entrega muito menos. Os primeiros 20% do trabalho resolvem o grosso. Os últimos 20% de acabamento quase ninguém nota.</p>
<h3>Parkinson</h3>
<p>Cyril Parkinson escreveu, meio de piada, que o trabalho se expande até ocupar todo o tempo disponível para fazê-lo. A piada pegou porque é verdade reconhecível. Se você tem um mês para fazer uma proposta, ela leva um mês. Se tem dois dias, leva dois dias, e raramente fica muito pior.</p>
<p>O uso pragmático é inverter: como o prazo molda o tamanho do trabalho, dê prazos curtos de propósito para tudo que não precisa ser perfeito. O prazo apertado faz o corte que você não teria coragem de fazer.</p>

<div class="box trigger" data-tid="08-1"><span class="box-t">Gatilho</span><p><b>Se</b> eu for começar uma tarefa que não é de alto risco, <b>então</b> antes de abrir o arquivo eu defino um tempo máximo, ligo o cronômetro do celular e entrego o que estiver pronto quando ele tocar.</p></div>

<h2>Defina "pronto" antes de começar</h2>
<p>O perfeccionismo prospera na falta de critério. Se você não escreveu o que é "pronto", sempre dá para melhorar mais um pouco, e a tarefa só termina quando você cansa ou quando o prazo estoura.</p>
<p>A saída é decidir o critério <strong>antes</strong>, com a cabeça fria, e não durante, quando você já está apegado ao trabalho. Três a cinco condições objetivas, do tipo que outra pessoa conseguiria conferir.</p>

<div class="box ex"><span class="box-t">Na prática</span><p>Imagine uma loja cadastrando cem produtos novos. Sem critério, cada descrição vira uma obra: uma hora por produto, cem horas no total. Com critério escrito antes ("pronto = título com marca e modelo, três fotos nítidas, cinco características em lista, medidas e peso conferidos, preço revisado"), cai para quinze minutos por produto. Depois de um mês, os dez que mais vendem ganham a descrição caprichada. O capricho vai para onde o retorno está, e isso só dá para saber depois de publicar.</p></div>

<p>O mesmo vale para escolhas. Antes de procurar fornecedor, apartamento ou candidato, escreva os critérios mínimos. O primeiro que atender a todos, leva. Se bater a vontade de "ver só mais alguns", pergunte o que exatamente você espera encontrar que o atual não tem. Se não souber responder, é o maximizador falando.</p>

<h2>Quando o perfeccionismo é o certo</h2>
<p>Bom o suficiente não é regra universal. Tem lugar onde o capricho extremo é exatamente o comportamento pragmático, porque o erro custa muito mais que o tempo de revisão. O critério é o mesmo do capítulo anterior: quanto custa errar e dá para desfazer?</p>

<li><strong>O núcleo da sua promessa ao cliente.</strong> Se você vende por ser rápido, a entrega tem que ser impecável. Se vende por ser especialista, a recomendação tem que estar certa.</li>
